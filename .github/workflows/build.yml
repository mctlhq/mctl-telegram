name: build

on:
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    # internal/db has two backends, and until now CI only ever exercised one.
    # Five tests gate on TEST_DATABASE_URL and skipped on every run, including
    # the only test in the repo that covers Postgres lock behaviour on a
    # migration. A test that always skips is a test that does not exist.
    #
    # Pinned to the major production runs: shared-pg is CNPG
    # ghcr.io/cloudnative-pg/postgresql:17.2
    # (mctl-gitops, platform-gitops/infra-components/data/cnpg/shared/cluster.yaml),
    # so the schema and catalog behaviour under test match what deploys.
    services:
      postgres:
        image: postgres@sha256:3267c505060a0052e5aa6e5175a7b41ab6b04da2f8c4540fc6e98a37210aa2d3 # 17.2
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: mctl_test
        ports:
          - 5432:5432
        # Without a healthcheck the job races the server's first boot and the
        # tests fail to connect rather than skipping, which is a different
        # false signal from the one this exists to fix.
        # pg_isready must be pointed at TCP explicitly. Bare pg_isready checks
        # the Unix socket, and the postgres image's entrypoint runs a temporary
        # socket-only server while it provisions POSTGRES_DB -- so the probe can
        # report healthy before the real server is listening on 5432. The job
        # then starts, `go test -race ./...` fails to connect, and those tests
        # SKIP, which is green. By the time the guard step below runs, TCP is up
        # and the tests pass there -- without -race. Net effect: the race
        # detector silently stops covering internal/db while CI stays green and
        # the guard stays satisfied. Intermittent by nature, which is worse.
        options: >-
          --health-cmd "pg_isready -h 127.0.0.1 -U postgres"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      TEST_DATABASE_URL: postgres://postgres:postgres@127.0.0.1:5432/mctl_test?sslmode=disable
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v4
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: "1.26.6"
      - run: go vet ./...
      - run: go build ./...
      # -race is not optional here: internal/bridge is a Hub of goroutines and
      # channels, and #495 was a send-on-closed-channel that plain `go test`
      # could never surface. The whole module passes under -race on main.
      - run: go test -race ./...
      # The Postgres-backed tests degrade to a skip, not a failure, when
      # TEST_DATABASE_URL is missing or the service container never came up --
      # so the step above stays green either way and the coverage this job
      # exists to add could be lost silently in some later edit. This asserts
      # they really ran. Cheap: the whole set is about a second.
      - name: postgres-backed tests must not skip
        run: |
          set -euo pipefail
          go test ./internal/db/ -count=1 -v -run 'Postgres|TestOpenPool' > /tmp/pg-tests.log 2>&1 || {
            cat /tmp/pg-tests.log
            exit 1
          }
          cat /tmp/pg-tests.log
          if grep -q "TEST_DATABASE_URL not set" /tmp/pg-tests.log; then
            echo "::error::Postgres-backed tests skipped -- the service container did not reach the test environment"
            exit 1
          fi
          # Indentation matters: `go test -v` indents subtest results, so an
          # anchored "^--- SKIP" sees a skipped top-level test but not a
          # skipped subtest. A table-driven rewrite of these tests would slip
          # straight through the strict anchor.
          if grep -Eq "^[[:space:]]*--- SKIP" /tmp/pg-tests.log; then
            echo "::error::a Postgres-backed test skipped for another reason; see the log above"
            exit 1
          fi
          # Nothing above fires when the -run filter matches NOTHING: go test
          # prints "no tests to run" and exits 0, so a rename that drops the
          # "Postgres" substring would leave this step green while testing
          # nothing at all -- the same silent loss the step exists to prevent,
          # reached by a different route.
          if grep -q "no tests to run" /tmp/pg-tests.log; then
            echo "::error::the -run filter matched no tests -- were the Postgres-backed tests renamed?"
            exit 1
          fi
          # Belt and braces for the case the warning text ever changes: assert
          # the count of top-level results. A floor, not an equality, so adding
          # a Postgres-backed test needs no CI edit; removing one is caught.
          # Raise it when the set below grows:
          #   TestOpenPool, TestRegisterDevice_PostgresUpsert,
          #   TestGrantClientTierIfUnset_PostgresHeldNoneIsNotOverwritten,
          #   TestGrantClientTierIfUnset_PostgresSetsClientWhenUnset,
          #   TestRevokeWorkerToken_PostgresUpsert
          expected=5
          passed=$(grep -c "^--- PASS" /tmp/pg-tests.log || true)
          if [ "$passed" -lt "$expected" ]; then
            echo "::error::expected at least $expected Postgres-backed tests to pass, saw $passed"
            exit 1
          fi
      - run: GOOS=darwin GOARCH=arm64 go build ./...
      - run: GOOS=windows GOARCH=amd64 go build ./cmd/local

  # The released darwin/* and windows/amd64 binaries were compiled but never
  # executed. `test` above cross-BUILDS them (GOOS=darwin/windows go build) and
  # runs on ubuntu only, so every runtime behaviour that differs by platform —
  # file modes, the umask helper, the device lock, path handling — shipped
  # unexercised. mctl-telegram#138 lists this as the remaining distribution gap:
  # "tests execute on Linux only, so the Windows and macOS binaries ship
  # compiled-but-unexercised".
  #
  # Deliberately a NEW job rather than a matrix on `test`. A matrix renames the
  # check to "test (ubuntu-latest)", and the required status check named "test"
  # would then never report again, blocking every PR — the same trap the
  # docker-agent-worker job below documents.
  #
  # What this job does NOT cover, so nobody reads it as broader than it is:
  #
  #   - Postgres. Service containers are Linux-only, so TEST_DATABASE_URL is
  #     unset here and the Postgres-backed tests skip. That coverage stays on
  #     `test`, which asserts they did not skip.
  #   - The race detector. It needs a cgo toolchain, which is a portability
  #     problem of its own on the Windows runner. Concurrency is covered under
  #     -race on ubuntu; this job is about platform behaviour, not scheduling.
  #
  # fail-fast is off: a macOS failure and a Windows failure are independent
  # findings and cancelling one to report the other wastes the run.
  #   - Server-side packages on Windows. The release builds windows/amd64 for
  #     ./cmd/local and nothing else; internal/agent/*, internal/agentworker and
  #     internal/mcp ship in a Linux container and are never executed on
  #     Windows. Running them there reports failures in code that cannot reach a
  #     user — a fake `claude` shell script that Windows cannot exec, and a
  #     file_path media feature internal/telegram/media_path.go rejects on
  #     Windows by design. macOS runs the whole module because it passes.
  test-cross-platform:
    name: test-cross-platform (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-latest
            packages: ./...
          - os: windows-latest
            packages: ./cmd/local/...
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v4
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: "1.26.6"
      - run: go build ./...
      - run: go test ${{ matrix.packages }}

  govulncheck:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v4
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: "1.26.6"
      - run: go install golang.org/x/vuln/cmd/govulncheck@latest
      - run: govulncheck ./...

  promtool-check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v4
      - name: install prometheus
        run: |
          PROM_VERSION=2.52.0
          curl -sSfL "https://github.com/prometheus/prometheus/releases/download/v${PROM_VERSION}/prometheus-${PROM_VERSION}.linux-amd64.tar.gz" \
            | tar -xz --strip-components=1 -C /usr/local/bin "prometheus-${PROM_VERSION}.linux-amd64/promtool"
      - name: check alert rules
        run: |
          # The manifest is a PrometheusRule CRD; promtool expects a bare rules
          # file (top-level groups:), so extract .spec before validating.
          yq '.spec' deploy/alerts/mctl-telegram.rules.yaml > /tmp/rules.yaml
          promtool check rules /tmp/rules.yaml
      - name: alert rule unit tests
        run: |
          # Syntactic validity is not behaviour. MctlBridgeDaemonsFlapping was
          # a well-formed expression that could never fire for the thing it
          # watched, and `check rules` passed on it every time.
          promtool test rules deploy/alerts/mctl-telegram.rules_test.yaml

  lint-grafana-json:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v4
      - name: lint-grafana-json
        run: |
          python3 -c "
          import json, glob
          files = glob.glob('deploy/grafana/**/*.json', recursive=True)
          if not files:
              raise SystemExit('no Grafana JSON files found')
          for f in files:
              with open(f) as fh:
                  json.load(fh)
          print('Grafana JSON valid:', files)
          "

  docker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v4
      - uses: docker/setup-buildx-action@37fe631027851001ddb9b187196cc803df7f5f0e # v4.3.0
      - uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
        with:
          context: .
          push: false
          cache-from: type=gha
          cache-to: type=gha,mode=max

  # This repo ships a second deployable image from the same commit: cmd/agent-worker
  # on a node:22-slim runtime with the claude CLI (see Dockerfile.agent-worker).
  # Until 2026-08-03 nothing built it on PRs — the job above passes `context: .`
  # with no `file:`, so it only ever built the default Dockerfile, and a change
  # that broke the worker image landed green and failed at deploy time instead.
  #
  # A separate job rather than a matrix on the job above: a matrix would rename
  # the check to "docker (Dockerfile)" and the existing required status check
  # named "docker" would never report again, blocking every PR.
  docker-agent-worker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v4
      - uses: docker/setup-buildx-action@37fe631027851001ddb9b187196cc803df7f5f0e # v4.3.0
      - uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
        with:
          context: .
          file: Dockerfile.agent-worker
          push: false
          # Explicit scope on BOTH ends so this job and `docker` don't evict each
          # other from the default shared cache key on every run (and so this one
          # actually reads back what it wrote).
          cache-from: type=gha,scope=agent-worker
          cache-to: type=gha,mode=max,scope=agent-worker

