name: Claude PR review

on:
  pull_request:
    types: [opened, reopened, synchronize, ready_for_review]
  issue_comment:
    types: [created]

permissions: {}

jobs:
  claude-review:
    uses: mctlhq/.github/.github/workflows/claude-review.yml@b0fc8003261139d919fdb91a565a60571e57d7c1
    permissions:
      contents: read
      pull-requests: write
      issues: write
      id-token: write
    with:
      sensitive-paths: '^internal/(auth|crypto|db|mcp|telegram)/'
      # dependabot, mctl-agents and cursor are listed so their PRs get
      # reviewed automatically.
      # Without it claude-code-action hard-fails with "Workflow initiated
      # by non-human actor", and since branch protection requires an
      # approving review, dependabot PRs then sit unmergeable until a
      # maintainer triggers a review by hand.
      #
      # cursor drives the cursor/* branches and pushes to them itself, so
      # only the first run (the human opening the PR) was ever reviewed and
      # every later synchronize was rejected in ~2s on both tokens. The
      # comment that failure posts says "failed to complete on both tokens",
      # which reads like an exhausted quota but is not one. Re-triggering
      # with @claude review does not help either: the actor check looks at
      # who initiated the workflow, so a bot comment fails the same way.
      allowed-bots: "mctl-claude-remote,github-actions,dependabot,mctl-agents,cursor"
      conventions: |
        Follow the conventions in this repository's CLAUDE.md (Go style,
        conventional commits, English only, no emoji).

        Focus on:
        - Correctness and logic errors; edge cases the change misses.
        - Security: injection, authentication/authorization, secret
          handling, unsafe input.
        - Concurrency: data races, deadlocks, goroutine leaks.
        - Error handling: ignored errors, missing context, panics.
        - Test coverage: behaviour changed without a corresponding test.
    secrets:
      CLAUDE_CODE_OAUTH_TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
      CLAUDE_CODE_OAUTH_TOKEN_2: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN_2 }}
