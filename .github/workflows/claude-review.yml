name: Claude PR review

on:
  pull_request:
    types: [opened, reopened, synchronize, ready_for_review]

permissions: {}

jobs:
  review:
    # Skip drafts and fork PRs: CLAUDE_CODE_OAUTH_TOKEN is not available to
    # forks, so the step would fail with a secret-not-found error. External
    # contributors get build/test/CodeQL feedback instead.
    if: >
      github.event.pull_request.draft == false &&
      github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write
      issues: write
      id-token: write
    steps:
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6
        with:
          fetch-depth: 1
      - name: Claude review
        uses: anthropics/claude-code-action@51ea8ea73a139f2a74ff649e3092c25a904aed7e # v1
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          # track_progress surfaces the review: it posts a tracking comment and
          # publishes the buffered inline comments. Without it the review runs
          # but its findings are never posted to the PR.
          track_progress: true
          prompt: |
            REPO: ${{ github.repository }}
            PR NUMBER: ${{ github.event.pull_request.number }}

            You are the automated code reviewer for this pull request. Review
            the PR diff thoroughly.

            Focus on:
            - Correctness and logic errors; edge cases the change misses.
            - Security: injection, authentication/authorization, secret
              handling, unsafe input.
            - Concurrency: data races, deadlocks, goroutine leaks.
            - Error handling: ignored errors, missing context, panics.
            - Test coverage: behaviour changed without a corresponding test.

            Follow the conventions in this repository's CLAUDE.md (Go style,
            conventional commits, English only, no emoji).

            If the diff is trivial — only config/values YAML (hostname, env
            var, image tag, resource limits, replica count), a dependency bump
            with no logic change, docs/comments, or a one-line typo — post a
            single short top-level approval comment and nothing else.

            Otherwise, post each finding as an inline comment using the
            mcp__github_inline_comment__create_inline_comment tool, prefixed
            with a severity tag:
            - P1 — must fix before merge (bug, security hole, data loss).
            - P2 — should fix before merge (likely bug, missing test, unsafe
              pattern).
            - P3 — nice to have (style, minor nit); does not block merge.

            Finish with a top-level summary comment: the count of P1/P2/P3
            findings and an explicit verdict — "No P1/P2 findings, good to
            merge" or "Has P1/P2 findings, changes requested". Be concise; do
            not restate the diff.
          claude_args: '--model claude-sonnet-4-6 --allowedTools "mcp__github_inline_comment__create_inline_comment,Bash(gh pr comment:*),Bash(gh pr diff:*),Bash(gh pr view:*)"'
