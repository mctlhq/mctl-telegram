name: Claude PR review

on:
  pull_request:
    types: [opened, reopened, synchronize, ready_for_review]
  issue_comment:
    types: [created]

permissions: {}

jobs:
  # Split into gate + review (2026-07-22, Claude review round on #309 caught
  # this): the hard write-permission/fork check must complete BEFORE the job
  # enters the review job's canceling concurrency group. If both lived in one
  # job, the coarse author_association pre-filter below is enough for a
  # read-only collaborator's comment to pass the job-level `if:` and enter
  # the concurrency group — with cancel-in-progress: true that cancels any
  # currently-running legitimate review, and only THEN does the (now
  # pointless) hard permission check fail. Splitting means the unauthorized
  # run fails in `gate` and never touches the concurrency group at all.
  gate:
    # pull_request: skip drafts and fork PRs (CLAUDE_CODE_OAUTH_TOKEN unavailable to forks)
    # issue_comment: only fire on PR comments containing '@claude review'
    # from a maintainer (association pre-filter here; hard write-permission +
    # same-repo check in the step below) — on a public repo an ungated
    # comment trigger lets any passerby burn review quota or prompt-inject
    # the reviewer.
    if: >
      (
        github.event_name == 'pull_request' &&
        github.event.pull_request.draft == false &&
        github.event.pull_request.head.repo.full_name == github.repository
      ) || (
        github.event_name == 'issue_comment' &&
        github.event.issue.pull_request != null &&
        contains(github.event.comment.body, '@claude review') &&
        contains(fromJSON('["OWNER","MEMBER","COLLABORATOR"]'), github.event.comment.author_association)
      )
    runs-on: ubuntu-latest
    # Read-only: this job only queries collaborator permission and PR
    # cross-repo status, both GET calls — it never writes anything, so it
    # needs no more than read access even though the downstream review job
    # (gated by needs: gate) has pull-requests: write for posting comments.
    permissions:
      contents: read
      pull-requests: read
    steps:
      # author_association alone is too coarse (MEMBER = any org member,
      # COLLABORATOR includes read-only). Require actual write access, and
      # refuse comment-triggered runs on fork PRs — the review job would
      # check out refs/pull/N/head, making fork-controlled files the
      # workspace while the OAuth secret is available.
      - name: Gate comment-triggered runs (write permission + same-repo)
        if: github.event_name == 'issue_comment'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          PERM=$(gh api "repos/${{ github.repository }}/collaborators/${{ github.event.comment.user.login }}/permission" --jq .permission)
          case "$PERM" in
            admin|maintain|write) ;;
            *) echo "::error::@claude review requires write access (commenter has: $PERM)"; exit 1 ;;
          esac
          CROSS=$(gh pr view "${{ github.event.issue.number }}" --repo "${{ github.repository }}" --json isCrossRepository --jq .isCrossRepository)
          if [ "$CROSS" != "false" ]; then
            echo "::error::comment-triggered review is not supported on fork PRs"
            exit 1
          fi

  review:
    needs: gate
    runs-on: ubuntu-latest
    # Bounds mid-flight duplication: pull_request (auto, on every push) and a
    # manual '@claude review' comment on the same commit are two independent
    # triggers for the workflow, and nothing before this stopped both runs
    # completing in parallel. cancel-in-progress only stops the SECOND of two
    # overlapping runs (the first may already have spent tokens/posted inline
    # comments before cancellation lands) — paired with the "already
    # reviewed" preflight check below, which turns the common case (comment
    # posted right after the auto-triggered run already finished) into a
    # near-zero-cost early exit instead. Only entered after `gate` succeeds —
    # see the job-split comment above for why.
    concurrency:
      group: claude-review-${{ github.repository }}-${{ github.event.pull_request.number || github.event.issue.number }}
      cancel-in-progress: true
    permissions:
      contents: read
      pull-requests: write
      issues: write
      id-token: write
    steps:
      - name: Resolve PR branch for issue_comment trigger
        if: github.event_name == 'issue_comment'
        id: pr-ref
        run: |
          ref=$(gh pr view ${{ github.event.issue.number }} --repo ${{ github.repository }} --json headRefName -q .headRefName)
          echo "ref=$ref" >> $GITHUB_OUTPUT
        env:
          GH_TOKEN: ${{ github.token }}

      # A push already auto-triggers a review for its own commit via the
      # pull_request/synchronize path — a manual '@claude review' comment
      # posted right after is only ever redundant with that, never with
      # itself, so this check only runs on the issue_comment path. Checks
      # this specific PR's own review list (via the GitHub reviews API,
      # which records the exact commit_id each review was submitted
      # against) for an existing TERMINAL VERDICT from claude[bot] on the
      # current head SHA — NOT workflow-run history, and not just "any
      # review record at all". Two rounds of review on this workflow itself
      # (#309) caught successive gaps here:
      #   1. A run-history check treated a job whose overall conclusion was
      #      "success" as "reviewed" even when the underlying Claude call
      #      failed (continue-on-error masks it) — silently blocking the
      #      exact manual retry the failure-notify comment invites. Fixed
      #      by switching to the PR's own posted reviews instead of run
      #      history, and to a bare headSha match not scoped to this PR.
      #   2. That fix still matched ANY review record for this commit,
      #      including bare COMMENTED entries the action posts for each
      #      inline finding (create_inline_comment) before it ever reaches
      #      the final `gh pr review --approve|--request-changes` call — a
      #      run that posted inline findings and then crashed before
      #      submitting a verdict would still count as "already reviewed",
      #      again blocking the retry. Filtering state to APPROVED or
      #      CHANGES_REQUESTED (the only two terminal verdict states this
      #      workflow's prompt ever submits) requires a REAL verdict, not
      #      just review activity, to count as done.
      #   3. The unpaginated API call only returns the first page (30
      #      items) — directly observed hitting this limit ourselves this
      #      session diagnosing #307/#308, which both have far more than 30
      #      review records after several rounds. --paginate aggregates
      #      every page so a recent verdict past page 1 is never missed.
      - name: Skip if this commit was already reviewed
        if: github.event_name == 'issue_comment'
        id: dedup
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          head_sha=$(gh pr view "${{ github.event.issue.number }}" --repo "${{ github.repository }}" --json headRefOid -q .headRefOid)
          already=$(gh api --paginate "repos/${{ github.repository }}/pulls/${{ github.event.issue.number }}/reviews" \
            --jq '[.[] | select(.user.login == "claude[bot]" and .commit_id == "'"$head_sha"'" and (.state == "APPROVED" or .state == "CHANGES_REQUESTED"))] | length' | \
            jq -s 'add > 0')
          echo "already_reviewed=$already" >> "$GITHUB_OUTPUT"
          if [ "$already" = "true" ]; then
            gh pr comment "${{ github.event.issue.number }}" --repo "${{ github.repository }}" \
              --body "Skipping — this commit ($head_sha) already has a Claude review verdict. Push a new commit, or check the run log if you expected a fresh pass and the previous run actually failed."
          fi

      - name: Checkout
        if: github.event_name != 'issue_comment' || steps.dedup.outputs.already_reviewed != 'true'
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6
        with:
          fetch-depth: 1
          ref: ${{ steps.pr-ref.outputs.ref }}

      # `gate` (above) has no concurrency control and completes
      # independently per run; only `review` enters the canceling
      # concurrency group, and GitHub gives no ordering guarantee for who
      # enters it first. A slower-to-gate run for an OLDER push can
      # therefore still be entering the group AFTER a NEWER push's run is
      # already reviewing — cancel-in-progress then kills the newer,
      # correct review and lets the stale one proceed, checking out and
      # reviewing outdated code while posting a verdict that reads as
      # covering the PR's current head. Reject here if the commit actually
      # on disk no longer matches the PR's live head — a stale run
      # self-cancels instead of silently reviewing the wrong commit.
      - name: Reject if this run's commit is no longer the PR's current head
        if: github.event_name != 'issue_comment' || steps.dedup.outputs.already_reviewed != 'true'
        id: staleness
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          pr="${{ github.event.pull_request.number || github.event.issue.number }}"
          current_head=$(gh pr view "$pr" --repo "${{ github.repository }}" --json headRefOid -q .headRefOid)
          checked_out=$(git rev-parse HEAD)
          if [ "$checked_out" != "$current_head" ]; then
            echo "::notice::stale run — checked out $checked_out but PR head is now $current_head; skipping"
            echo "stale=true" >> "$GITHUB_OUTPUT"
          else
            echo "stale=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Classify PR complexity and pick model
        id: classify
        if: (github.event_name != 'issue_comment' || steps.dedup.outputs.already_reviewed != 'true') && steps.staleness.outputs.stale != 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          PR=${{ github.event.pull_request.number || github.event.issue.number }}

          # Collect changed file paths (newline-separated)
          files=$(gh pr view "$PR" --repo ${{ github.repository }} \
            --json files --jq '[.files[].path] | join("\n")')

          # Count added/removed lines (exclude diff headers)
          lines=$(gh pr diff "$PR" --repo ${{ github.repository }} 2>/dev/null \
            | grep -c '^[+-][^+-]' || true)

          # Score: 3=opus, 2=sonnet, 1=haiku
          score=1
          while IFS= read -r f; do
            if echo "$f" | grep -qE '^internal/(auth|crypto|db|mcp|telegram)/'; then
              score=3; break
            elif echo "$f" | grep -qE '\.go$' && ! echo "$f" | grep -qE '_test\.go$'; then
              [ $score -lt 2 ] && score=2
            fi
          done <<< "$files"

          # Large diffs bump one tier (up to opus)
          if [ "$lines" -gt 400 ] && [ $score -lt 3 ]; then
            score=$((score + 1))
          fi

          case $score in
            3) model="claude-sonnet-4-6" ;;
            2) model="claude-sonnet-4-6" ;;
            *) model="claude-haiku-4-5-20251001" ;;
          esac

          echo "model=$model"   >> $GITHUB_OUTPUT
          echo "score=$score"   >> $GITHUB_OUTPUT
          echo "lines=$lines"   >> $GITHUB_OUTPUT
          echo "PR #$PR: model=$model score=$score lines=$lines"

      - name: Claude review
        id: review
        if: (github.event_name != 'issue_comment' || steps.dedup.outputs.already_reviewed != 'true') && steps.staleness.outputs.stale != 'true'
        continue-on-error: true
        uses: anthropics/claude-code-action@51ea8ea73a139f2a74ff649e3092c25a904aed7e # v1
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          # The mctl-agents pipeline pushes review-fix commits to same-repo
          # feat/agents-* branches as this GitHub App; without the allowlist
          # entry the action hard-fails the whole review run on the
          # synchronize event ("Workflow initiated by non-human actor").
          allowed_bots: "mctl-claude-remote"
          track_progress: true
          prompt: |
            REPO: ${{ github.repository }}
            PR NUMBER: ${{ github.event.pull_request.number || github.event.issue.number }}

            You are the automated code reviewer for this pull request. Review
            the PR diff thoroughly.

            Focus on:
            - Correctness and logic errors; edge cases the change misses.
            - Security: injection, authentication/authorization, secret
              handling, unsafe input.
            - Concurrency: data races, deadlocks, goroutine leaks.
            - Error handling: ignored errors, missing context, panics.
            - Test coverage: behaviour changed without a corresponding test.

            Follow the conventions in this repository's CLAUDE.md (Go style,
            conventional commits, English only, no emoji).

            If the diff is trivial — only config/values YAML (hostname, env
            var, image tag, resource limits, replica count), a dependency bump
            with no logic change, docs/comments, or a one-line typo — approve
            the PR with a one-line reason and nothing else:
            `gh pr review ${{ github.event.pull_request.number || github.event.issue.number }} --repo ${{ github.repository }} --approve --body "<reason>"`.

            Otherwise, post each finding as an inline comment using the
            mcp__github_inline_comment__create_inline_comment tool, prefixed
            with a severity tag:
            - P1 — must fix before merge (bug, security hole, data loss).
            - P2 — should fix before merge (likely bug, missing test, unsafe
              pattern).
            - P3 — nice to have (style, minor nit); does not block merge.

            Finish by submitting a single PR review verdict (this is the merge
            gate — `main` requires one approving review). Include the P1/P2/P3
            counts in the body; be concise and do not restate the diff:
            - No P1/P2 findings (P3 nits are fine): approve —
              `gh pr review ${{ github.event.pull_request.number || github.event.issue.number }} --repo ${{ github.repository }} --approve --body "No P1/P2 findings (<n> P3). Good to merge."`
            - One or more P1/P2 findings: request changes —
              `gh pr review ${{ github.event.pull_request.number || github.event.issue.number }} --repo ${{ github.repository }} --request-changes --body "Has P1/P2 findings, changes requested: <summary>"`
          claude_args: '--model ${{ steps.classify.outputs.model }} --allowedTools "mcp__github_inline_comment__create_inline_comment,Bash(gh pr comment:*),Bash(gh pr review:*),Bash(gh pr diff:*),Bash(gh pr view:*)"'

      - name: Check primary review actually succeeded
        # The action can report GH Actions outcome=success while the
        # underlying SDK call itself errored (e.g. instant quota-exhaustion
        # failure) — outcome alone would silently miss that. Read the raw
        # execution output the action always writes to confirm the run
        # really finished cleanly.
        id: review-check
        if: always()
        run: |
          OUT="$RUNNER_TEMP/claude-execution-output.json"
          is_error="false"
          if [ -f "$OUT" ]; then
            is_error=$(jq -r '
              if type != "array" then "false"
              else ([.[] | select(.type == "result")] | if length > 0 then (.[-1].is_error // false | tostring) else "false" end)
              end' "$OUT" 2>/dev/null || echo "false")
          fi
          if [ "${{ steps.review.outcome }}" = "failure" ] || [ "$is_error" = "true" ]; then
            echo "failed=true" >> "$GITHUB_OUTPUT"
          else
            echo "failed=false" >> "$GITHUB_OUTPUT"
          fi

      # No automatic fallback-token retry: CLAUDE_CODE_OAUTH_TOKEN and
      # CLAUDE_CODE_OAUTH_TOKEN_2 were directly observed (2026-07-22) to fail
      # identically on the same run with "You've hit your org's monthly
      # usage limit" ~16s apart — consistent with both drawing on the same
      # org-wide quota, which would make an automatic second full session
      # guaranteed to fail the same way while still burning real tokens
      # first. Post a status comment instead and let a human decide whether
      # to re-trigger (e.g. once the underlying cause is confirmed to be
      # token-specific rather than quota exhaustion).
      - name: Notify on primary review failure
        if: steps.review-check.outputs.failed == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh pr comment "${{ github.event.pull_request.number || github.event.issue.number }}" --repo "${{ github.repository }}" \
            --body "Claude review failed to complete (see the [run log](${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }})). Not auto-retrying — re-trigger manually with \`@claude review\` once the underlying issue is resolved."
