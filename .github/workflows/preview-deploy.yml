name: Preview Deploy
run-name: "preview-deploy main-${{ github.sha }}"

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions: {}

jobs:
  preview:
    runs-on: ubuntu-latest
    # Main-only; holds DISPATCH_APP_PRIVATE_KEY (#1033).
    environment: app-dispatch
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v4

      # Uses mctl-gitops-dispatch, an App that can only dispatch workflows
      # (actions:write + metadata:read) and is installed on mctl-gitops alone
      # (mctlhq/mctl-gitops#1033). Its key lives in the main-only `app-dispatch`
      # environment, so a run from any other branch cannot mint a token.
      #
      # It cannot read contents, so the "is the values file there" guard below
      # reads with the job's own GITHUB_TOKEN instead: mctl-gitops is a public
      # repository. If it ever goes private, that read answers 404 for lack of
      # access, which the guard reads as "absent" and skips silently; make the
      # guard fail closed (or give it a read-capable App) before that happens.
      - name: Generate Platform App token
        id: app
        uses: actions/create-github-app-token@64ab729a6294000f5aa4a4bc0b73d1f32bc45510 # v3.3.0
        with:
          client-id: ${{ vars.DISPATCH_APP_CLIENT_ID }}
          private-key: ${{ secrets.DISPATCH_APP_PRIVATE_KEY }}
          owner: mctlhq
          repositories: mctl-gitops

      - name: Dispatch preview release-deploy
        env:
          GH_TOKEN: ${{ steps.app.outputs.token }}
          SHA: ${{ github.sha }}
        run: |
          SHORT_SHA="${SHA::7}"
          gh workflow run release-deploy.yaml \
            --repo mctlhq/mctl-gitops \
            --ref main \
            -f repo=mctlhq/mctl-telegram \
            -f git_ref="$SHA" \
            -f image_name=ghcr.io/mctlhq/mctl-telegram \
            -f image_tag="main-${SHORT_SHA}" \
            -f team_name=labs \
            -f component_name=mctl-telegram-preview

      # Second deployable image from this same commit: cmd/agent-worker, built
      # from Dockerfile.agent-worker onto a node:22-slim runtime with the claude
      # CLI. Before 2026-08-03 only the dispatch above existed, so the worker
      # image was rebuilt by hand or not at all — the running pod sat on a
      # 2026-07-26 build while main moved four agent-worker commits ahead,
      # including a fix for adversarial prompt echoes, and nothing surfaced it.
      #
      # image_tag deliberately matches the dispatch above (same short SHA): both
      # images come from one commit, so "which code is this worker running" stays
      # answerable by reading the tag. The two release-deploy runs race to push
      # their tag bumps to mctl-gitops main; that push retries with a rebase
      # (mctl-gitops .github/workflows/release-deploy.yaml, "Commit and push").
      - name: Dispatch agent-worker preview release-deploy
        env:
          GH_TOKEN: ${{ steps.app.outputs.token }}
          SHA: ${{ github.sha }}
        run: |
          SHORT_SHA="${SHA::7}"
          gh workflow run release-deploy.yaml \
            --repo mctlhq/mctl-gitops \
            --ref main \
            -f repo=mctlhq/mctl-telegram \
            -f git_ref="$SHA" \
            -f image_name=ghcr.io/mctlhq/agent-worker-preview \
            -f image_tag="main-${SHORT_SHA}" \
            -f dockerfile_path=Dockerfile.agent-worker \
            -f team_name=labs \
            -f component_name=agent-worker-preview

      # Preview of the managed agent runtime (docs/adr/0008-managed-runtime.md
      # section 6): component agent-worker-managed-preview runs the same
      # agent-worker-preview image as the step above, so this run builds and
      # pushes the same tag a second time in parallel. That is harmless: both
      # components pin by tag, both build from one commit and Dockerfile, and
      # gitops pushes are rebase-retried.
      #
      # Guarded: release-deploy exits 2 when the component's values file is
      # missing, and the component only appears with mctl-gitops#2345. Absence
      # (HTTP 404) skips with a notice; any unobservable read fails the step.
      - name: Dispatch agent-worker-managed-preview release-deploy
        env:
          GH_TOKEN: ${{ steps.app.outputs.token }}
          # The dispatch App cannot read contents; the guard reads a public repo.
          READ_TOKEN: ${{ github.token }}
          SHA: ${{ github.sha }}
        run: |
          SHORT_SHA="${SHA::7}"
          VALUES=platform-gitops/services/labs/agent-worker-managed-preview/values.yaml
          rc=0; GH_TOKEN="$READ_TOKEN" .github/scripts/gitops-values-present.sh "$VALUES" || rc=$?
          case "$rc" in
            0)
              gh workflow run release-deploy.yaml \
                --repo mctlhq/mctl-gitops \
                --ref main \
                -f repo=mctlhq/mctl-telegram \
                -f git_ref="$SHA" \
                -f image_name=ghcr.io/mctlhq/agent-worker-preview \
                -f image_tag="main-${SHORT_SHA}" \
                -f dockerfile_path=Dockerfile.agent-worker \
                -f team_name=labs \
                -f component_name=agent-worker-managed-preview
              ;;
            3)
              echo "::notice::$VALUES not on mctl-gitops main; skipping agent-worker-managed-preview dispatch"
              ;;
            *)
              echo "::error::could not read $VALUES on mctl-gitops main (rc=$rc)"
              exit 1
              ;;
          esac
