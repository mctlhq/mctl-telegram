name: release-please

on:
  push:
    branches: [main]

permissions: {}

jobs:
  release-please:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
      # administration: write lets the auto-merge step bypass branch
      # protection on the release PR (a version-bump + changelog commit that
      # the default GITHUB_TOKEN cannot get a review/CI signal for, since
      # release-please opens it with that same token).
      administration: write
    steps:
      - uses: googleapis/release-please-action@5c625bfb5d1ff62eadeeb3772007f7f66fdcf071 # v4
        id: release
        with:
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json

      # Auto-merge the release PR the action just opened. A standalone
      # workflow on `pull_request` cannot do this: release-please opens the PR
      # with GITHUB_TOKEN, and GitHub suppresses workflow triggers for default-
      # token events, so the pull_request event never fires. Merging here, in
      # the same run, sidesteps that. The merge pushes to main, which re-runs
      # this workflow; that run sees release_created and cuts the tag below.
      - name: Auto-merge release PR
        if: ${{ steps.release.outputs.prs_created == 'true' }}
        env:
          GH_TOKEN: ${{ github.token }}
          PR_JSON: ${{ steps.release.outputs.pr }}
          REPO: ${{ github.repository }}
        run: |
          PR=$(echo "$PR_JSON" | jq -r '.number')
          echo "Auto-merging release PR #$PR"
          gh pr merge "$PR" --repo "$REPO" --merge --admin

      - name: Generate Platform App token
        if: ${{ steps.release.outputs.release_created == 'true' }}
        id: app
        uses: actions/create-github-app-token@d72941d797fd3113feb6b93fd0dec494b13a2547 # v1
        with:
          app-id: ${{ secrets.APP_ID }}
          private-key: ${{ secrets.APP_PRIVATE_KEY }}
          owner: mctlhq
          repositories: mctl-gitops

      - name: Dispatch centralized release-deploy
        if: ${{ steps.release.outputs.release_created == 'true' }}
        env:
          GH_TOKEN: ${{ steps.app.outputs.token }}
          TAG: ${{ steps.release.outputs.tag_name }}
        run: |
          gh workflow run release-deploy.yaml \
            --repo mctlhq/mctl-gitops \
            --ref main \
            -f repo=mctlhq/mctl-telegram \
            -f git_ref="$TAG" \
            -f image_name=ghcr.io/mctlhq/mctl-telegram \
            -f image_tag="$TAG" \
            -f team_name=labs \
            -f component_name=mctl-telegram
