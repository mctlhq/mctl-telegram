apiVersion: monitoring.coreos.com/v1
kind: PrometheusRule
metadata:
  name: mctl-telegram-canary
  namespace: monitoring
  labels:
    prometheus: kube-prometheus
    role: alert-rules
spec:
  groups:
    - name: mctl-telegram-canary
      interval: 60s
      rules:
        - alert: MctlTelegramCanaryFailing
          expr: max_over_time(mctl_telegram_canary_success[10m]) == 0
          for: 5m
          labels:
            severity: critical
            service: mctl-telegram
          annotations:
            summary: "mctl-telegram canary probe has been failing for ~15 minutes"
            description: >
              The synthetic end-to-end canary for mctl-telegram has reported
              mctl_telegram_canary_success=0 for every run in the last 10
              minutes, and the condition has persisted for at least 5 more
              minutes (~15 minutes of continuous failure total).
              Check mctl_telegram_canary_step_failure_total to identify
              which probe step is failing (oauth_metadata, list_dialogs, or
              get_unread_messages).
              Runbook: https://github.com/mctlhq/mctl-telegram/blob/main/docs/runbooks/canary.md
        - alert: MctlTelegramCanaryStale
          expr: time() - push_time_seconds{job="mctl_telegram_canary"} > 600
          for: 5m
          labels:
            severity: warning
            service: mctl-telegram
          annotations:
            summary: "mctl-telegram canary has not pushed metrics in 10 minutes"
            description: >
              The canary CronJob has not successfully pushed metrics to
              Pushgateway in the last 10 minutes (schedule is */2 * * * *).
              The CronJob may be failing to start or complete. Check pod logs
              and CronJob status in the labs namespace.
              Runbook: https://github.com/mctlhq/mctl-telegram/blob/main/docs/runbooks/canary.md
        - alert: MctlTelegramCanaryAbsent
          expr: absent_over_time(mctl_telegram_canary_success[15m])
          for: 0m
          labels:
            severity: warning
            service: mctl-telegram
          annotations:
            summary: "mctl-telegram canary metrics absent for 15 minutes"
            description: >
              No mctl_telegram_canary_success samples have arrived in the last
              15 minutes. Pushgateway may be down or the metric group was
              deleted. Check Pushgateway health and CronJob pod logs.
              Runbook: https://github.com/mctlhq/mctl-telegram/blob/main/docs/runbooks/canary.md
        - alert: MctlTelegramCanaryTokenExpiring
          # Fires once the bearer token has under 7 days left. Since
          # mctl-telegram#412 the token is deliberately bounded (30d default,
          # 90d ceiling). Since #421 the canary renews itself, so reaching
          # this threshold now means renewal has been failing for days —
          # MctlTelegramCanaryTokenRenewalFailing below should already have
          # fired — or the credential has hit its one-year renewal ceiling
          # and genuinely needs a human with an admin:users login. Seven days
          # is chosen to survive a week of leave, not to be a tight deadline.
          #
          # No absent() companion here on purpose: the series is intentionally
          # absent when the token carries no readable exp claim, and
          # MctlTelegramCanaryAbsent already covers "the canary stopped
          # reporting at all".
          expr: mctl_telegram_canary_token_expires_in_seconds < 7 * 24 * 3600
          for: 10m
          labels:
            severity: warning
            service: mctl-telegram
          annotations:
            summary: "mctl-telegram canary token expires in under 7 days"
            description: >
              CANARY_BEARER_TOKEN has less than 7 days of life left
              ({{ $value | humanizeDuration }} remaining). When it expires the
              canary goes red and stays red until the token is reminted. Remint
              with POST /api/mcp/worker-token (admin:users scope required) and
              write the result into the mctl-telegram-canary Secret in the labs
              namespace.
              Runbook: https://github.com/mctlhq/mctl-telegram/blob/main/docs/runbooks/canary.md
        - alert: MctlTelegramCanaryTokenRenewalFailing
          # Renewal is deliberately fail-open: a failed renewal leaves the run
          # green because the token it fell back on is still valid. That is
          # the right behaviour for a probe — a broken renewal is not an
          # outage of the service under test — but it means nothing about
          # mctl_telegram_canary_success will ever reveal it. This alert is
          # the only thing that does.
          #
          # Firing here is not urgent: the canary only attempts renewal in the
          # last third of the token's life, so there are ~10 days left when
          # the first failure lands. It is a warning precisely so it can be
          # handled in working hours, well before
          # MctlTelegramCanaryTokenExpiring escalates the same problem.
          expr: mctl_telegram_canary_step_failure_total{step="token_renew"} > 0
          for: 30m
          labels:
            severity: warning
            service: mctl-telegram
          annotations:
            summary: "mctl-telegram canary cannot renew its own token"
            description: >
              The canary attempted to renew CANARY_BEARER_TOKEN and failed.
              The run itself still succeeded on the existing token, which has
              roughly 10 days left, so this is not yet user-visible — but it
              will become one if left alone. The pod log carries the exact
              reason; the usual causes are missing RBAC on the
              mctl-telegram-canary Secret and an exhausted one-year renewal
              window.
              Runbook: https://github.com/mctlhq/mctl-telegram/blob/main/docs/runbooks/canary.md
