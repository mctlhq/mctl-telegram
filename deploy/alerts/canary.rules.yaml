apiVersion: monitoring.coreos.com/v1
kind: PrometheusRule
metadata:
  name: mctl-telegram-canary
  namespace: monitoring
  labels:
    prometheus: kube-prometheus
    role: alert-rules
spec:
  groups:
    - name: mctl-telegram-canary
      interval: 60s
      rules:
        - alert: MctlTelegramCanaryFailing
          expr: max_over_time(mctl_telegram_canary_success[10m]) == 0
          for: 5m
          labels:
            severity: critical
            service: mctl-telegram
          annotations:
            summary: "mctl-telegram canary probe has been failing for 5 minutes"
            description: >
              The synthetic end-to-end canary for mctl-telegram has reported
              mctl_telegram_canary_success=0 for every scrape in the last 10
              minutes, and the condition has persisted for at least 5 minutes.
              Check mctl_telegram_canary_step_failure_total{step=} to identify
              which probe step is failing (oauth_metadata, list_dialogs, or
              get_unread_messages).
              Runbook: https://github.com/mctlhq/mctl-telegram/blob/main/docs/runbooks/canary.md
        - alert: MctlTelegramCanaryAbsent
          expr: absent_over_time(mctl_telegram_canary_success[15m])
          for: 0m
          labels:
            severity: warning
            service: mctl-telegram
          annotations:
            summary: "mctl-telegram canary metrics absent for 15 minutes"
            description: >
              No mctl_telegram_canary_success samples have arrived in the last
              15 minutes. The CronJob may have stopped running or Pushgateway
              pushes are failing silently. Check the CronJob status and recent
              job pod logs.
              Runbook: https://github.com/mctlhq/mctl-telegram/blob/main/docs/runbooks/canary.md
