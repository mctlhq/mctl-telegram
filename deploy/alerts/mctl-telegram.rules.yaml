# STATUS: NON-DEPLOYED REFERENCE. Nothing applies this file.
#
# Every alert below is now deployed. The live definitions are in mctl-gitops,
# which is what ArgoCD reconciles, under
# platform-gitops/infra-components/observability/vm-rules/:
#
#   mctl-telegram-alerts.yaml   threshold alerts (JWT, tool error rate and
#                               latency, rate limiting, /healthz, login stalls)
#   mctl-telegram-slo.yaml      the SLO recording rules and burn-rate alerts
#                               from docs/slo.md
#   mctl-telegram-canary.yaml   the synthetic end-to-end canary
#   mctl-telegram-ops.yaml      pool capacity, flood wait, OAuth pending,
#                               Local Bridge flapping, communication agent
#
# Until 2026-09-07 this header named six families that were deployed nowhere
# at all. They are the contents of mctl-telegram-ops.yaml above; the port is
# mctlhq/mctl-telegram#555 and mctlhq/mctl-gitops#1074. Nothing in this file
# is awaiting deployment any more.
#
# It is kept, rather than deleted, for one reason that has nothing to do with
# alerting: runbook_links_test.go reads the runbook_url of every alert here and
# fails when the anchor it points at does not exist in docs/runbook.md. Three
# alerts once shipped with dangling anchors, and that check lives only in this
# repository — docs/runbook.md is here, the deployed rules are not. The rules
# below are the input it needs.
#
# Consequences, unchanged and now the only thing this header is really for:
#
#   - Editing an expression here changes nothing in the cluster. Edit the
#     corresponding mctl-gitops file.
#   - Where a rule appears in both places and they disagree, mctl-gitops wins.
#     MctlTelegramLoginSendCodeStalls is the current example: it reads
#     "increase(...) >= 2" here and "> 1" in the deployed rule, because
#     increase() extrapolates to a float and an exactly-two-timeout window can
#     interpolate to 1.97 and miss a >= 2 test.
#   - Adding an alert here deploys nothing. Add it to mctl-gitops, and add it
#     here too only if you want the runbook anchor checked.
#
# Behavioural coverage now lives with the deployed rules: vm-rules/tests/ in
# mctl-gitops carries unit tests for all four files above, including twelve
# mutation-validated cases for the families ported in #555. The local
# mctl-telegram.rules_test.yaml still covers MctlBridgeDaemonsFlapping and is
# kept as the regression test for #467.
#
apiVersion: monitoring.coreos.com/v1
kind: PrometheusRule
metadata:
  name: mctl-telegram
  namespace: monitoring
  labels:
    prometheus: kube-prometheus
    role: alert-rules
spec:
  groups:
    - name: mctl-telegram.rules
      rules:
        - alert: MctlTelegramPoolNearCapacity
          expr: |
            (mctl_telegram_client_pool_size / mctl_telegram_pool_capacity) > 0.85
            and (mctl_telegram_client_pool_size / mctl_telegram_pool_capacity) < 0.95
            and mctl_telegram_pool_capacity > 0
          for: 5m
          labels:
            severity: warning
            service: mctl-telegram
          annotations:
            summary: "mctl-telegram session pool above 85% capacity"
            description: >
              The session pool utilization is at {{ $value | humanizePercentage }}.
              Consider increasing the replica count or raising TELEGRAM_MAX_SESSIONS
              if headroom permits.
            runbook_url: "https://github.com/mctlhq/mctl-telegram/blob/main/docs/runbook.md#mctltelegramnearcapacity"

        - alert: MctlTelegramPoolNearCapacity
          expr: |
            (mctl_telegram_client_pool_size / mctl_telegram_pool_capacity) > 0.95
            and mctl_telegram_pool_capacity > 0
          for: 2m
          labels:
            severity: critical
            service: mctl-telegram
          annotations:
            summary: "mctl-telegram session pool above 95% capacity"
            description: >
              The session pool utilization is at {{ $value | humanizePercentage }}.
              The pool is critically full. Scale out immediately or raise
              TELEGRAM_MAX_SESSIONS if headroom permits.
            runbook_url: "https://github.com/mctlhq/mctl-telegram/blob/main/docs/runbook.md#mctltelegramnearcapacity"

        - alert: MctlTelegramFloodWaitSpike
          expr: |
            sum(rate(mctl_telegram_flood_wait_events_total[5m])) > 0.5
            and sum(rate(mctl_telegram_flood_wait_events_total[5m])) < 2
          for: 2m
          labels:
            severity: warning
            service: mctl-telegram
          annotations:
            summary: "mctl-telegram flood-wait rate above 0.5 events/s"
            description: >
              Telegram flood-wait events are arriving at {{ $value | humanize }} per
              second. This indicates rate-limit pressure from Telegram. Reduce
              request fan-out or add backoff logic.
            runbook_url: "https://github.com/mctlhq/mctl-telegram/blob/main/docs/runbook.md#mctltelegramfloodwaitspike"

        - alert: MctlTelegramFloodWaitSpike
          expr: sum(rate(mctl_telegram_flood_wait_events_total[5m])) > 2
          for: 2m
          labels:
            severity: critical
            service: mctl-telegram
          annotations:
            summary: "mctl-telegram flood-wait rate above 2 events/s"
            description: >
              Telegram flood-wait events are arriving at {{ $value | humanize }} per
              second. Heavy rate-limit pressure detected. Reduce request fan-out or
              add backoff logic immediately.
            runbook_url: "https://github.com/mctlhq/mctl-telegram/blob/main/docs/runbook.md#mctltelegramfloodwaitspike"

        - alert: MctlTelegramOAuthPendingStuck
          expr: mctl_oauth_pending_auth_size > 100
          for: 15m
          labels:
            severity: warning
            service: mctl-telegram
          annotations:
            summary: "mctl-telegram OAuth pending authorizations above 100"
            description: >
              There are {{ $value | humanize }} in-flight OAuth authorization flows. A sustained
              high value with no corresponding traffic suggests abandoned flows or
              bot-scan traffic against /oauth/authorize.
            runbook_url: "https://github.com/mctlhq/mctl-telegram/blob/main/docs/runbook.md#mctltelegramoauthpendingstuck"

        - alert: MctlTelegramLoginSendCodeStalls
          expr: sum(increase(mctl_login_phone_step_total{result="timeout"}[15m])) >= 2
          for: 1m
          labels:
            severity: warning
            service: mctl-telegram
          annotations:
            summary: "mctl-telegram logins stalling at the SendCode step"
            description: >
              {{ $value | humanize }} enable_access phone steps hit the SendCode
              wait timeout in the last 15m. The connect/SendCode round-trip is
              stalling — check the "telegram login: connecting / connection
              established" breadcrumbs and the deferred "enable: telegram login
              failed" logs to localise the hang.
            runbook_url: "https://github.com/mctlhq/mctl-telegram/blob/main/docs/runbook.md#mctltelegramloginsendcodestalls"

        - alert: MctlTelegramLoginSlow
          expr: |
            histogram_quantile(0.95,
              sum(rate(mctl_login_phone_to_code_duration_seconds_bucket[30m])) by (le)
            ) > 30
          for: 10m
          labels:
            severity: warning
            service: mctl-telegram
          annotations:
            summary: "mctl-telegram login SendCode p95 above 30s"
            description: >
              The 95th-percentile connect + SendCode latency is {{ $value | humanize }}s,
              approaching the 90s enableSendCodeWait ceiling. Logins are
              degrading and will start timing out if this rises further.
            runbook_url: "https://github.com/mctlhq/mctl-telegram/blob/main/docs/runbook.md#mctltelegramloginslow"

        # Counts registrations per daemon, not transitions of a shared gauge.
        # The previous form, changes(mctl_bridge_active_daemons[10m]) > 20,
        # could not fire for a flapping daemon: the reconnect ladder in
        # cmd/local/daemon.go caps at 60s and only resets after a session
        # lasting 60s, so a genuinely flapping daemon settles at ~10 cycles
        # per 10 minutes = 20 changes, which is not > 20. The alert therefore
        # fired for the first two minutes, while the backoff was still
        # climbing, and RESOLVED ITSELF once the flap became permanent —
        # reading to an operator as "it recovered".
        #
        # Threshold justified against the mechanics rather than scaled by
        # guesswork: a healthy daemon registers exactly once per server
        # rollout, so 4 or more registrations in 10 minutes means either a
        # reconnect loop or an implausible burst of deploys. A 60s-cycle flap
        # produces ~10 and fires comfortably.
        - alert: MctlBridgeDaemonsFlapping
          expr: increase(mctl_bridge_connections_total[10m]) > 3
          for: 0m
          labels:
            severity: warning
            service: mctl-telegram
          annotations:
            summary: "mctl-telegram Local Bridge daemon {{ $labels.user_id }} is reconnecting in a loop"
            description: >
              Local Bridge daemon for user {{ $labels.user_id }} registered
              {{ $value | humanize }} times in the last 10 minutes. A healthy daemon
              registers once per server rollout. This may signal a looping reconnect,
              a token rotation problem, or network instability on the daemon host.
            runbook_url: "https://github.com/mctlhq/mctl-telegram/blob/main/docs/runbook.md#mctlbridgedaemonsflapping"

        # A daemon refused at /bridge never registers, so the flapping alert
        # above cannot see it: mctl_bridge_connections_total only moves on a
        # successful Register. The pilot daemon that lost its credential on
        # the 0.62.3 rollout (#612) failed authentication once a minute for
        # two days with no metric moving at all. This counts the refusals
        # themselves (provider="bridge" is emitted only by the bridge
        # handler and the bridge token endpoint). Summed per reason across
        # replicas, so a two-pod deployment does not halve the rate.
        # Threshold from the daemon's mechanics: its reconnect
        # ladder caps at 60s, so a stuck daemon produces ~15 refusals per
        # 15 minutes; a token that expired mid-session produces one or two
        # before the refresh lands, hence > 5, and `for: 10m` outlasts a
        # single rollout.
        # `no_token` is excluded: /bridge is public and unauthenticated, so
        # a bare request with no credential counts there, and no daemon ever
        # sends one -- keeping it in would let any passer-by fire the alert.
        # It stays in the metric and the log for the operator.
        - alert: MctlBridgeAuthFailing
          expr: sum by (reason) (increase(mctl_auth_failures_total{provider="bridge",reason!="no_token"}[15m])) > 5
          for: 10m
          labels:
            severity: warning
            service: mctl-telegram
          annotations:
            summary: "mctl-telegram Local Bridge daemon is being refused ({{ $labels.reason }})"
            description: >
              The bridge refused {{ $value | humanize }} daemon credentials in the last
              15 minutes with reason {{ $labels.reason }}. The daemon is looping on a
              credential the server no longer accepts; the server log names it
              ("bridge: authentication failed" / "bridge token: credential refused").
            runbook_url: "https://github.com/mctlhq/mctl-telegram/blob/main/docs/runbook.md#mctlbridgeauthfailing"

    - name: mctl-telegram-agent
      rules:
        # The three alerts below (MctlAgentClaudeUsageLimit,
        # MctlAgentPolicyDenialRateHigh, MctlAgentJobCostHigh) are mirror-only,
        # same as every other rule in this file: editing them here changes
        # nothing in the cluster. The deployed copy is the operator's separate
        # change to platform-gitops/infra-components/observability/vm-rules/
        # mctl-telegram-ops.yaml in mctl-gitops. They are added here only so
        # runbook_links_test.go can check their runbook_url anchors.
        - alert: MctlAgentDeadLetter
          expr: increase(mctl_agent_dead_letter_total[15m]) > 0
          for: 0m
          labels:
            severity: warning
            service: mctl-telegram
          annotations:
            summary: "Communication-agent job reached dead letter"
            description: >
              {{ $value | humanize }} communication-agent jobs exhausted their
              attempts in the last 15 minutes. Keep the test window closed if
              failures are unexplained and follow the dead-letter procedure.
            runbook_url: "https://github.com/mctlhq/mctl-telegram/blob/main/docs/runbook.md#communication-agent-operations"

        - alert: MctlAgentActionsExecutingStuck
          expr: mctl_agent_actions_executing_stuck > 0
          for: 5m
          labels:
            severity: critical
            service: mctl-telegram
          annotations:
            summary: "Communication-agent actions remain stuck in executing"
            description: >
              {{ $value | humanize }} actions are past the executor recovery
              grace window. Close the agent window before investigating; do
              not manually resend because Telegram may have accepted the
              original random_id.
            runbook_url: "https://github.com/mctlhq/mctl-telegram/blob/main/docs/runbook.md#communication-agent-operations"

        # Not a rate threshold: a presence test. The worker runs against a
        # dedicated Claude credential domain (AGENT_CREDENTIAL_DOMAIN_ID is
        # required by cmd/agent-worker/main.go's run(); the C1 report records
        # the isolated OAuth token provisioned specifically so worker spend
        # never shares a pool with interactive sessions or claude-review.yml).
        # Nothing in normal operation consumes that pool except the worker,
        # so one usage-limit stop means the isolated pool is exhausted, and
        # because Worker.Loop (internal/agentworker/worker.go) processes jobs
        # sequentially, every subsequent job hits the same wall until the
        # quota window resets. Any occurrence is therefore actionable; a
        # nonzero-count threshold would only delay the page.
        # `> 0` rather than `>= 1` follows this file's own header note about
        # increase() extrapolating to a float (an exactly-two-window sample
        # can interpolate to 1.97 and miss `>= 2`).
        # sum() collapses replicas so a multi-pod worker Deployment raises one
        # alert, not one per pod. 15m matches MctlAgentDeadLetter above.
        - alert: MctlAgentClaudeUsageLimit
          expr: |
            sum(increase(mctl_agent_claude_result_errors_total{class="usage_limit"}[15m])) > 0
          for: 0m
          labels:
            severity: warning
            service: mctl-telegram
          annotations:
            summary: "Communication-agent Claude credential hit its usage limit"
            description: >
              The agent-worker's dedicated Claude credential
              (mctl_agent_claude_result_errors_total{class="usage_limit"})
              reported a usage-limit/quota error in the last 15 minutes.
              Worker.Loop processes jobs sequentially, so every job after this
              one blocks on the same exhausted pool until the quota window
              resets.
            runbook_url: "https://github.com/mctlhq/mctl-telegram/blob/main/docs/runbook.md#mctlagentclaudeusagelimit"

        # Aggregated by `reason`, not `surface`: `reason` is the label an
        # operator acts on (autopilot_paused/conversation_taken_over are the
        # guarded system working as designed; global_kill,
        # reply_contains_credentials, or a spike of `unknown` each imply a
        # different response), and grouping by `reason` makes each reason
        # clear the threshold on its own so a benign steady stream cannot mask
        # a new reason appearing beside it.
        #
        # Denominator: no metric counts allowed policy evaluations —
        # CountPolicyDenial (internal/metrics/metrics.go) fires only on
        # policy.Deny (internal/agentapi/actions.go,
        # internal/agent/executor/executor.go) — so a true denial rate is not
        # computable from what #583 registered.
        # mctl_agent_jobs_total{status="processing"}, incremented once per
        # claim in Queue.Claim (internal/agent/queue/queue.go), is the closest
        # available proxy for "opportunities to be denied" and is emitted by
        # the same process as the denials, so no cross-target label surgery is
        # needed. The ratio can legitimately exceed 1: actions.go counts a
        # denial from each evaluation, including redeliveries of the same job,
        # so a worker hammering a paused account inflates the numerator above
        # the claim count — that is the anomaly signal, not a bug.
        #
        # Threshold: still unmeasured, and unlike MctlAgentJobCostHigh below
        # it could not be re-derived on 2026-09-09, because
        # mctl_agent_policy_denials_total does not exist in VictoriaMetrics at
        # all — not a single denial has been counted in this deployment. The
        # counter is also created lazily, so its absence conflates "no denials"
        # with "no baseline" and there is no way to tell them apart from the
        # series alone. PR mctlhq/mctl-telegram#593 (NOT yet on main at the
        # time of writing) adds a zero baseline for all 108 combinations, which
        # is the precondition for ever deriving this number: until it ships and
        # a current image is scraped, an empty result here means nothing.
        #
        # 0.20 therefore stands as originally taken, on the conservative side:
        # one denial in five claimed jobs, sustained over half an hour, for a
        # single reason. Re-derive it once the counter has actually moved.
        # Note that a denominator of claimed jobs is correct HERE — denials are
        # counted per evaluation including redeliveries, so the ratio can
        # legitimately exceed 1, and that inflation is the "worker hammering a
        # paused account" signal this counter exists for.
        #
        # The `> 4` floor exists because a share computed from a low-volume
        # denominator is arithmetic, not evidence: without it, one denial
        # during a near-idle window reads as 100%.
        #
        # `> 4` rather than `>= 5`: increase() extrapolates to a float, so a
        # window holding exactly five denials can evaluate to 4.8 and miss an
        # integer boundary. This file's own header records that failure for
        # `>= 2` against an interpolated 1.97. `> 4` keeps the intent ("at
        # least five") without sitting on the boundary.
        #
        # `or vector(0)` on the denominator: sum() over an ABSENT series
        # returns an empty vector, not 0 — so before any job has ever been
        # claimed, scalar() would yield NaN, `NaN > 0.20` is false, and the
        # rule would stay silent while denials climbed. Owner-facing denials
        # (request_owner_approval, send_owner_summary) do not go through
        # Queue.Claim, so that state is reachable rather than theoretical.
        # With the guard the denominator is 0, the ratio is +Inf, and the
        # floor clause still requires real denial volume before it fires.
        - alert: MctlAgentPolicyDenialRateHigh
          expr: |
            (
              sum by (reason) (rate(mctl_agent_policy_denials_total[30m]))
              /
              scalar(sum(rate(mctl_agent_jobs_total{status="processing"}[30m])) or vector(0))
            ) > 0.20
            and
            sum by (reason) (increase(mctl_agent_policy_denials_total[30m])) > 4
          for: 0m
          labels:
            severity: warning
            service: mctl-telegram
          annotations:
            summary: "Communication-agent policy-denial share is high for reason {{ $labels.reason }}"
            description: >
              {{ $labels.reason }} denials are above 20% of claimed agent jobs
              over the last 30 minutes, with at least 5 denials in the window.
              Check agent_actions.policy_reasons to decide whether this is the
              guarded system working as designed or a new/runaway denial
              reason.
            runbook_url: "https://github.com/mctlhq/mctl-telegram/blob/main/docs/runbook.md#mctlagentpolicydenialratehigh"

        # Numerator: all spend, both result="success" and result="error",
        # because ClaudeInvoker.recordCost (internal/agentworker/
        # claudeinvoker.go:197) runs before countResultError (:199) — a job
        # that fails afterwards still reports its spend.
        #
        # Denominator: every TERMINAL job status — completed, ignored, failed
        # and dead_letter, the four end states in db's
        # "pending -> processing -> completed | failed | ignored" plus the
        # attempts-exhausted path (internal/db/agent_jobs.go). Never
        # status="succeeded", which is not a label value this code can emit.
        # The ratio reads as dollars per job the agent FINISHED.
        #
        # This was status="completed" alone until issue mctlhq/mctl-telegram#596,
        # on the argument that it read as dollars per *delivered outcome*. The
        # argument was sound and the premise was false: measured against
        # VictoriaMetrics on 2026-09-09, mctl_agent_jobs_total{status=
        # "completed"} had never been incremented at all. Jobs on this
        # deployment terminate as `ignored` — the agent deciding no reply is
        # warranted, which is a normal outcome that costs money. The
        # denominator was therefore permanently empty, `or vector(0)` made the
        # ratio +Inf on every evaluation, this clause constrained nothing, and
        # the rule had silently degenerated into "hourly spend > $0.50".
        #
        # Retries still raise the ratio, which was the original intent: a retry
        # increments status="processing", which is not terminal and is not in
        # this denominator. Dividing by claims was rejected for exactly that
        # reason and stays rejected.
        #
        # sum() on both sides: mctl_agent_job_cost_usd_total is emitted by the
        # agent-worker process (cmd/agent-worker/main.go) while
        # mctl_agent_jobs_total is emitted by the server process
        # (internal/agent/queue/queue.go), so their instance/pod labels differ
        # and a label-matched division could never produce a sample.
        #
        # Divide-by-zero: spend with zero terminal jobs evaluates the ratio to
        # +Inf, which compares true — deliberate, since paying for nothing is
        # worth a page. The second clause (absolute spend floor) guards
        # against a stray fraction of a cent in an idle hour firing this.
        #
        # That only holds with `or vector(0)`. sum() over an ABSENT series
        # returns an empty vector rather than 0, and dividing by an empty
        # vector yields an empty vector — no +Inf, no alert. A total
        # termination outage (the exact runaway this rule is for) is precisely
        # when every one of these label values can be missing. Without the
        # guard the rule would be silent in its own headline scenario.
        # mctl-telegram#591 (PR mctlhq/mctl-telegram#593, NOT yet on main at
        # the time of writing) adds a zero baseline for all six job statuses at
        # registry construction, so once that ships and a current image is
        # scraped the series exist even when idle. The guard is not redundant
        # after it: it still covers older images, a scrape gap before the
        # baseline is first observed, and a total loss of the emitting target.
        #
        # Thresholds: MEASURED, not guessed. Both were $0.50 and both were
        # wrong, in opposite directions. Source is 7.3 h of VictoriaMetrics
        # data from 08:40 UTC 2026-09-09 — the moment
        # mctl_agent_job_cost_usd_total first appeared — sampled at a
        # 10-minute step over a 1 h window (44-45 points), preview deployment,
        # guarded mode, one account's real inbound traffic:
        #
        #   hourly spend        p50 $0.165  p95 $0.400  p99 $0.482
        #   terminal jobs / h   p50 13      p95 31      max 36
        #   $ per terminal job  p50 $0.0129 p95 $0.0160 p99 $0.0203
        #
        # 0.10 per terminal job is ~5x the observed p99: it catches a 5x
        # per-job cost regression and is immune to normal variance. The old
        # $0.50 was ~25x p99 and could never have fired.
        #
        # 1.00 per hour is ~2x the observed p99 hourly spend. The old $0.50
        # sat AT the noise ceiling (p99 $0.482, zero of 44 windows above it),
        # so with the ratio clause dead it would have begun paging on ordinary
        # traffic within days. This clause's only job is to gate the ratio
        # against low-volume arithmetic; with a working denominator it is no
        # longer the de-facto trigger, which is why it can be raised without
        # losing coverage.
        #
        # Re-derive after a full week of data, and again after any change to
        # guarded-mode traffic (intent_allowlist, sender_allowlist, listener
        # scope) — the numbers above describe one account's DM volume, not a
        # steady state anyone has committed to. AGENT_MAX_BUDGET_USD is still
        # not a substitute: it is an operator value applied by the CLI only
        # when > 0, a per-job ceiling inside one invocation, aggregating
        # nothing. If it is set, keep the per-job threshold below that cap so
        # this alert precedes the CLI's hard stop.
        - alert: MctlAgentJobCostHigh
          expr: |
            (
              sum(increase(mctl_agent_job_cost_usd_total[1h]))
              /
              (sum(increase(mctl_agent_jobs_total{status=~"^(completed|ignored|failed|dead_letter)$"}[1h])) or vector(0))
            ) > 0.10
            and
            sum(increase(mctl_agent_job_cost_usd_total[1h])) > 1.00
          for: 0m
          labels:
            severity: warning
            service: mctl-telegram
          annotations:
            summary: "Communication-agent spend per finished job is high"
            description: >
              Claude spend per finished communication-agent job over the last
              hour is above $0.10, with total spend in the window above $1.00.
              This is dollars per job the agent finished — completed, ignored,
              failed or dead-lettered — not per attempt, so a retry storm that
              spends without finishing jobs raises this ratio. May render as
              +Inf when spend occurred with zero finished jobs in the window;
              that is intended.
            runbook_url: "https://github.com/mctlhq/mctl-telegram/blob/main/docs/runbook.md#mctlagentjobcosthigh"

    - name: mctl-telegram-tool-availability
      rules:
        - alert: MctlToolAvailabilityFastBurn
          # 14.4x burn over 1h: error rate > 7.2% consumes the 0.5% budget
          # 14.4x faster than allowed. For: 0m — the 1h window is the
          # stabilization period. See docs/slo.md for the error-budget policy.
          expr: |
            sum(rate(mctl_tool_invocations_total{status="error"}[1h]))
            /
            sum(rate(mctl_tool_invocations_total[1h]))
            > 0.072
          for: 0m
          labels:
            severity: page
            service: mctl-telegram
          annotations:
            summary: "mctl-telegram MCP tool availability fast burn (14.4x, 1h)"
            description: >
              The MCP tool error rate over the last 1h is {{ $value | humanizePercentage }},
              which exceeds the 7.2% fast-burn threshold (14.4x the 99.5% SLO budget).
              The 30-day error budget is burning rapidly. Page the on-call engineer.
              See docs/slo.md for the error-budget policy and recovery criteria.
            runbook_url: "https://github.com/mctlhq/mctl-telegram/blob/main/docs/slo.md"

        - alert: MctlToolAvailabilitySlowBurn
          # 6x burn over 6h: error rate > 3.0% sustained for 6h erodes 36% of
          # the monthly budget. Ticket-severity: no immediate page required.
          expr: |
            sum(rate(mctl_tool_invocations_total{status="error"}[6h]))
            /
            sum(rate(mctl_tool_invocations_total[6h]))
            > 0.030
          for: 0m
          labels:
            severity: ticket
            service: mctl-telegram
          annotations:
            summary: "mctl-telegram MCP tool availability slow burn (6x, 6h)"
            description: >
              The MCP tool error rate over the last 6h is {{ $value | humanizePercentage }},
              which exceeds the 3.0% slow-burn threshold (6x the 99.5% SLO budget).
              Budget erosion is sustained but not critical. File a reliability ticket.
              See docs/slo.md for the error-budget policy and recovery criteria.
            runbook_url: "https://github.com/mctlhq/mctl-telegram/blob/main/docs/slo.md"

    - name: mctl-telegram-oauth-availability
      rules:
        - alert: MctlOAuthAvailabilityFastBurn
          # 14.4x burn over 1h on a 99.9% SLO (0.1% budget):
          # error rate > 1.440% exhausts the budget at 14.4x.
          expr: |
            sum(rate(mctl_http_requests_total{route=~"/oauth/token|/oauth/telegram/callback",status_code=~"5.."}[1h]))
            /
            sum(rate(mctl_http_requests_total{route=~"/oauth/token|/oauth/telegram/callback"}[1h]))
            > 0.01440
          for: 0m
          labels:
            severity: page
            service: mctl-telegram
          annotations:
            summary: "mctl-telegram OAuth endpoint availability fast burn (14.4x, 1h)"
            description: >
              The OAuth endpoint (/oauth/token, /oauth/telegram/callback) 5xx rate
              over the last 1h is {{ $value | humanizePercentage }}, exceeding the
              1.440% fast-burn threshold (14.4x the 99.9% SLO budget).
              The 30-day error budget is burning rapidly. Page the on-call engineer.
              See docs/slo.md for the error-budget policy and recovery criteria.
            runbook_url: "https://github.com/mctlhq/mctl-telegram/blob/main/docs/slo.md"

        - alert: MctlOAuthAvailabilitySlowBurn
          # 6x burn over 6h on a 99.9% SLO: error rate > 0.600%.
          expr: |
            sum(rate(mctl_http_requests_total{route=~"/oauth/token|/oauth/telegram/callback",status_code=~"5.."}[6h]))
            /
            sum(rate(mctl_http_requests_total{route=~"/oauth/token|/oauth/telegram/callback"}[6h]))
            > 0.00600
          for: 0m
          labels:
            severity: ticket
            service: mctl-telegram
          annotations:
            summary: "mctl-telegram OAuth endpoint availability slow burn (6x, 6h)"
            description: >
              The OAuth endpoint (/oauth/token, /oauth/telegram/callback) 5xx rate
              over the last 6h is {{ $value | humanizePercentage }}, exceeding the
              0.600% slow-burn threshold (6x the 99.9% SLO budget).
              Budget erosion is sustained but not critical. File a reliability ticket.
              See docs/slo.md for the error-budget policy and recovery criteria.
            runbook_url: "https://github.com/mctlhq/mctl-telegram/blob/main/docs/slo.md"

    # The deployment gate that used to sit here ("pending instrumentation",
    # deploy only after a 6h soak) is spent: mctl_sessions_borrow_total is
    # registered in internal/metrics/metrics.go and these rules are live in
    # mctl-gitops as MctlTelegramSessionBorrow{Fast,Slow}Burn. Kept here as a
    # reference copy only -- see the header.
    - name: mctl-telegram-session-borrow
      rules:
        - alert: MctlSessionBorrowFastBurn
          # 14.4x burn over 1h on a 99% SLO (1% budget):
          # error rate > 14.4% exhausts the budget at 14.4x.
          expr: |
            sum(rate(mctl_sessions_borrow_total{result="error"}[1h]))
            /
            sum(rate(mctl_sessions_borrow_total{result=~"ok|error"}[1h]))
            > 0.144
          for: 0m
          labels:
            severity: page
            service: mctl-telegram
          annotations:
            summary: "mctl-telegram session borrow success rate fast burn (14.4x, 1h)"
            description: >
              The session borrow error rate (excluding TTL expirations) over the
              last 1h is {{ $value | humanizePercentage }}, exceeding the 14.4%
              fast-burn threshold (14.4x the 99% SLO budget).
              The 30-day error budget is burning rapidly. Page the on-call engineer.
              See docs/slo.md for the error-budget policy and recovery criteria.
            runbook_url: "https://github.com/mctlhq/mctl-telegram/blob/main/docs/slo.md"

        - alert: MctlSessionBorrowSlowBurn
          # 6x burn over 6h on a 99% SLO: error rate > 6%.
          expr: |
            sum(rate(mctl_sessions_borrow_total{result="error"}[6h]))
            /
            sum(rate(mctl_sessions_borrow_total{result=~"ok|error"}[6h]))
            > 0.060
          for: 0m
          labels:
            severity: ticket
            service: mctl-telegram
          annotations:
            summary: "mctl-telegram session borrow success rate slow burn (6x, 6h)"
            description: >
              The session borrow error rate (excluding TTL expirations) over the
              last 6h is {{ $value | humanizePercentage }}, exceeding the 6.0%
              slow-burn threshold (6x the 99% SLO budget).
              Budget erosion is sustained but not critical. File a reliability ticket.
              See docs/slo.md for the error-budget policy and recovery criteria.
            runbook_url: "https://github.com/mctlhq/mctl-telegram/blob/main/docs/slo.md"
