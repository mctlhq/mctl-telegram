# NOT THE DEPLOYED MANIFEST. Nothing applies this file.
#
# The canary that actually runs in production is rendered from
# mctl-gitops/platform-gitops/services/labs/mctl-telegram/values.yaml and is
# named labs-mctl-telegram-canary (every 10 minutes, not suspended). This file
# is a reference/local-dev copy that drifted: it still carries suspend:true and
# a */2 schedule from a debugging session that ended long ago.
#
# Keeping that straight matters. On 2026-08-27 a design proposal for
# mctl-telegram#421 read this file, concluded it was the deployment, and put
# the canary's ServiceAccount and RBAC here — where they would have applied to
# nothing while every symptom looked correct. Change the gitops values.yaml,
# not this file, for anything that must take effect.
apiVersion: batch/v1
kind: CronJob
metadata:
  name: mctl-telegram-canary
  namespace: labs
spec:
  # Suspended while debugging the enable_access SendCode timeout: the every-2-min
  # list_dialogs probe shares the server's Telegram egress IP, and we are ruling
  # out whether it contributes to new-login SendCode throttling. Re-enable
  # (suspend: false) once the login hang is diagnosed.
  suspend: true
  schedule: "*/2 * * * *"
  concurrencyPolicy: Forbid
  successfulJobsHistoryLimit: 3
  failedJobsHistoryLimit: 5
  jobTemplate:
    spec:
      activeDeadlineSeconds: 120
      template:
        spec:
          imagePullSecrets:
            - name: ghcr-credentials
          restartPolicy: Never
          securityContext:
            runAsNonRoot: true
            runAsUser: 1000
          containers:
            - name: canary
              image: ghcr.io/mctlhq/mctl-telegram:0.37.2
              command: ["/usr/local/bin/mctl-telegram-canary"]
              securityContext:
                allowPrivilegeEscalation: false
                readOnlyRootFilesystem: true
                capabilities:
                  drop: ["ALL"]
              env:
                - name: CANARY_BASE_URL
                  value: "https://tg.mctl.ai"
                - name: CANARY_TG_USER_ID
                  valueFrom:
                    secretKeyRef:
                      name: mctl-telegram-canary
                      key: tg_user_id
                - name: CANARY_BEARER_TOKEN
                  valueFrom:
                    secretKeyRef:
                      name: mctl-telegram-canary
                      key: bearer_token
                - name: CANARY_PROBE_UNREAD
                  value: "true"
                - name: PUSHGATEWAY_URL
                  value: "http://prometheus-pushgateway.monitoring.svc.cluster.local:9091"
              resources:
                requests:
                  cpu: "10m"
                  memory: "32Mi"
                limits:
                  cpu: "100m"
                  memory: "64Mi"
