# deploy/ingress/sticky-envoy.yaml
#
# Istio EnvoyFilter + DestinationRule for sticky per-user routing in
# multi-replica mctl-telegram deployments using Envoy as the sidecar proxy.
#
# HOW IT WORKS
# ------------
# The EnvoyFilter inserts a Lua HTTP filter that:
#   1. Strips any client-supplied X-Mctl-Route-Key header (prevents forgery).
#   2. Extracts the JWT payload, base64-decodes it, and reads the "sub" claim.
#   3. Sets the x-mctl-route-key request header to the decoded sub.
# The DestinationRule then uses consistent-hash load balancing on that header,
# directing all requests with the same sub to the same upstream pod.
#
# SECURITY ANALYSIS
# -----------------
# The JWT signature is NOT verified at this tier. This is intentional:
#   - Envoy without the Istio JWT AuthN filter does not ship HS256 verification
#     as a first-class feature.
#   - The routing key carries no authorization weight. The application's auth
#     middleware (internal/auth/middleware.go) re-verifies the full JWT on every
#     request and rejects tampered tokens.
#   - A client that edits its JWT sub to route to a different pod still gets
#     rejected by that pod's auth check. No privilege escalation is possible.
#
# DOWNWARD API
# ------------
# For the replica_id label in mctl_telegram_replica_id to be useful, inject
# POD_NAME via the Kubernetes downward API in the Deployment spec:
#
#   env:
#     - name: POD_NAME
#       valueFrom:
#         fieldRef:
#           fieldPath: metadata.name
#
# REQUIREMENTS
# ------------
# - Istio >= 1.14 (Lua filter support is stable in this range)
# - Update namespace, host, and service labels below for your cluster.
#
# GATEWAY API ALTERNATIVE
# -----------------------
# For clusters using Gateway API v1.2+ without Istio, an equivalent setup uses
# an HTTPRoute with a request-header-modifier filter together with a
# BackendLBPolicy (GEP-1731) specifying consistent_hash.httpHeader. Note that
# BackendLBPolicy is experimental in Gateway API v1.2; the Istio DestinationRule
# below is the stable, widely-deployed choice.
#
# NOTE: This file is a standalone example. The platform team adapts it into
# the appropriate kustomize overlay in mctl-gitops before deploying.
---
# EnvoyFilter: inject Lua HTTP filter to extract the JWT sub and set the
# routing header. Applied to the ingress gateway (or sidecars if using
# sidecar-based routing).
apiVersion: networking.istio.io/v1alpha3
kind: EnvoyFilter
metadata:
  name: mctl-telegram-route-key
  namespace: mctl
spec:
  workloadSelector:
    labels:
      app: istio-ingressgateway  # adjust if using sidecar-based routing
  configPatches:
    - applyTo: HTTP_FILTER
      match:
        context: GATEWAY
        listener:
          filterChain:
            filter:
              name: envoy.filters.network.http_connection_manager
              subFilter:
                name: envoy.filters.http.router
      patch:
        operation: INSERT_BEFORE
        value:
          name: envoy.filters.http.lua
          typed_config:
            "@type": type.googleapis.com/envoy.extensions.filters.http.lua.v3.LuaPerRoute
            inline_code: |
              function envoy_on_request(request_handle)
                -- Step 1: strip any client-supplied routing header to prevent forgery.
                request_handle:headers():remove("x-mctl-route-key")

                -- Step 2: extract and decode the JWT sub claim.
                local auth = request_handle:headers():get("authorization")
                if auth then
                  local token = string.match(auth, "^[Bb]earer%s+(.+)$")
                  if token then
                    local parts = {}
                    for part in string.gmatch(token, "[^.]+") do
                      parts[#parts + 1] = part
                    end
                    if parts[2] then
                      -- base64url to standard base64 with padding
                      local b64 = parts[2]:gsub("-", "+"):gsub("_", "/")
                      local pad = (4 - #b64 % 4) % 4
                      b64 = b64 .. string.rep("=", pad)
                      -- Envoy provides base64.decode via the standard Lua API
                      local payload = base64.decode(b64)
                      if payload then
                        -- Parse sub from JSON; simple pattern match avoids
                        -- importing a full JSON library.
                        local sub = string.match(payload, '"sub"%s*:%s*"([^"]+)"')
                        if sub then
                          -- Step 3: set the routing header from the decoded sub.
                          request_handle:headers():add("x-mctl-route-key", sub)
                        end
                      end
                    end
                  end
                end
              end
---
# DestinationRule: consistent-hash load balancing on the routing header.
apiVersion: networking.istio.io/v1alpha3
kind: DestinationRule
metadata:
  name: mctl-telegram-sticky
  namespace: mctl
spec:
  host: mctl-telegram.mctl.svc.cluster.local  # adjust FQDN for your cluster
  trafficPolicy:
    loadBalancer:
      consistentHash:
        httpHeaderName: "x-mctl-route-key"
