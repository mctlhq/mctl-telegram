# deploy/ingress/sticky-nginx.yaml
#
# NGINX Ingress Controller (community edition, v1.2+) configuration for
# sticky per-user routing in multi-replica mctl-telegram deployments.
#
# HOW IT WORKS
# ------------
# Each MCP request carries an Authorization: Bearer <jwt> header whose payload
# (the middle dot-delimited segment) contains a "sub" claim of the form
# "tg:<telegram_id>". The Lua snippet below:
#   1. Strips any client-supplied X-Mctl-Route-Key header (prevents forgery).
#   2. Extracts the JWT payload, base64url-decodes it, and JSON-decodes the sub.
#   3. Sets X-Mctl-Route-Key to the decoded sub.
# NGINX then performs ketama consistent-hash routing on that header value,
# directing all requests with the same sub to the same upstream pod.
#
# SECURITY ANALYSIS
# -----------------
# The JWT signature is NOT verified at this tier. This is intentional:
#   - NGINX community edition does not ship HS256 verification; adding it would
#     require distributing OAUTH_JWT_SIGNING_KEY outside the pod boundary.
#   - The routing key carries no authorization weight. The application's auth
#     middleware (internal/auth/middleware.go) re-verifies the full JWT on every
#     request and rejects tampered tokens.
#   - A client that edits its JWT sub to route to a different pod still gets
#     rejected by that pod's auth check. No privilege escalation is possible.
#
# DOWNWARD API
# ------------
# For the replica_id label in mctl_telegram_replica_id to be useful, inject
# POD_NAME via the Kubernetes downward API in the Deployment spec:
#
#   env:
#     - name: POD_NAME
#       valueFrom:
#         fieldRef:
#           fieldPath: metadata.name
#
# REQUIREMENTS
# ------------
# - ingress-nginx >= v1.2 (LuaJIT enabled by default in the official image)
# - Update the namespace, service name, and host fields below for your cluster.
#
# NOTE: This file is a standalone example. The platform team adapts it into
# the appropriate kustomize overlay in mctl-gitops before deploying.
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: mctl-telegram
  namespace: mctl
  annotations:
    # Ketama consistent-hash on the injected routing header.
    nginx.ingress.kubernetes.io/upstream-hash-by: "$http_x_mctl_route_key"

    # Lua snippet: strip client header, extract JWT sub, set routing header.
    # Runs before upstream selection so the hash sees the server-injected value.
    nginx.ingress.kubernetes.io/configuration-snippet: |
      # Step 1: strip any client-supplied routing header to prevent forgery.
      more_clear_input_headers "X-Mctl-Route-Key";

      # Step 2: extract and decode the JWT sub claim.
      local auth = ngx.var.http_authorization
      if auth then
        local token = string.match(auth, "^[Bb]earer%s+(.+)$")
        if token then
          local parts = {}
          for part in string.gmatch(token, "[^.]+") do
            parts[#parts + 1] = part
          end
          if parts[2] then
            -- JWT payload is base64url; ngx.decode_base64 handles standard
            -- base64. Convert url-safe chars first and add padding.
            local b64 = parts[2]:gsub("-", "+"):gsub("_", "/")
            local pad = (4 - #b64 % 4) % 4
            b64 = b64 .. string.rep("=", pad)
            local payload = ngx.decode_base64(b64)
            if payload then
              local ok, data = pcall(require("cjson").decode, payload)
              if ok and data and data.sub then
                -- Step 3: set the routing header from the verified sub claim.
                ngx.req.set_header("X-Mctl-Route-Key", data.sub)
              end
            end
          end
        end
      end
spec:
  ingressClassName: nginx
  rules:
    - host: mctl-telegram.example.com  # replace with your hostname
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: mctl-telegram
                port:
                  number: 8080
