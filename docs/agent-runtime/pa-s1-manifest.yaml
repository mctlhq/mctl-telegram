# S1 test manifest (threat model "Gate evidence", #1317).
#
# Every S1 id in personal-assistant-threat-model.md maps to the test functions
# that cover it, as <package dir>.<TestFunc>. docs/pa_s1_manifest_test.go fails
# when an id has no test, when a named test does not exist, when an id here is
# not in the threat model, or when a test whose name claims an S1 id is not
# listed under that id. Mutation evidence per id is in the gate PR.
#
# gaps: the parts of a row that have no guard yet. Each must name its half and
# the issue that builds it (tracked_by: "#NNNN"); the gate refuses a gap
# without one, and prints every open gap (go test -v ./docs -run
# TestPAS1Manifest). The S1 gate is NOT closed while any gap is listed: #1317
# cannot close, and the preview gate (#1318) cannot pass, until the list is
# empty. A run with PA_S1_GATE_CLOSING=1 fails on any listed gap.

