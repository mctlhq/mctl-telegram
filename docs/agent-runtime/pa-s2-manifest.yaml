  note: "Disclosure card (#1322 P2-S6): safetext.DisclosureCard shows the speaker's home, room, name and device id as the speaker read gave them and the whole text on a line of its own, exactly as it is sent, with the room warning on a phrase that is said aloud. The card is refused, never cut, when the text or the id could not be shown unchanged or the card does not fit one message. The speaker's names are sealed with the arguments (approval.SealWithDetail) and the delivered card is rebuilt from that blob. alice_play_music (P2-S14b): safetext.MusicCard shows the speaker's home, room, name and id, the exact query, and the command as the server sends it (the fixed prefix \"включи музыку \" and the query). The query passes a re-implementation of mctl-alice's rule set or there is no card (query_not_allowed): it is refused, never trimmed or rewritten. connector.TestMusicQuery_AgreesWithUpstreamCases feeds that re-implementation the cases of mctl-alice's own test file at 5f6755b7 (testdata/alice_music_queries.json: 86 refused, 16 accepted), so the two cannot drift without a red test once the cases are regenerated. The card path requires the pin entry to be a write, lowerable never, with a text_cap of 100 on the query. A home or a room the listing reports as null is shown as not reported (P2-S14b reads the household from the structured listing, which closes the card-without-a-home gap)."
