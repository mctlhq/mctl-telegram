# S2 test manifest (threat model "Gate evidence", #1323).
#
# PHASE 2 WRITES CANNOT BE ENABLED WHILE ANY ID BELOW IS PENDING OR ANY GAP IS
# OPEN. PA_WRITES_ENABLED stays off on every environment until this file has
# no pending id and no gap. Slice P2-S14 closes the gate: it runs the check
# with PA_S2_GATE_CLOSING=1 (the phase2_gate=closed mode), which fails on any
# pending id or gap.
#
# Every S2 row of personal-assistant-threat-model.md has exactly one entry
# here, in threat model order. docs/pa_s2_manifest_test.go fails when a row is
# missing, when an id here is not a row, when an id is listed twice, when an
# S2 id is written in the threat model in any shape other than a "- S2-XX:"
# row, or when a test whose name claims an S2 id (TestS2I6_..., or
# Test<Area>_S2A1_...) is not listed under that id.
#
# status: pending -- not built yet. slice: the Phase 2 slice that builds it
#   (P2-S<n>); tracked_by: the issue that owns the id ("#NNNN"). Both are
#   required. A pending id may list tests that already exist, and has no
#   gaps: the whole row is open.
# status: green -- covered. tests: every test function that covers it, as
#   <package dir>.<TestFunc>; each must exist. mutations: at least one record
#   per id, each with:
#     id        unique within the entry
#     guard     <file>.go:<line> of the guarded code, at the commit the
#               mutation ran on (must exist in the tree and be in range)
#     guard_text text of the current tree that occurs exactly once in the
#               guard file and covers the guard line; when the guard line
#               is not unique in its file, it runs onto the lines around it
#               ("\n\t" escapes in a double-quoted string). When the code
#               moves, the record fails until guard and guard_text are
#               pointed at the guard again
#     mutation  what was broken
#     killed_by the tests that went red; each must be listed under tests
#     red       the mutated run's output: a "FAIL" result line and a
#               "--- FAIL: <name> (" line for every killing test
#     green     the run after git restore: an "ok  <pkg>" line, no FAIL
#   A test in a file CI's build leaves out (a build tag such as smoke, a
#   //go:build !race constraint, since CI runs go test -race, or a _windows
#   file name) is not evidence and may not be listed.
#   slice: the slice that delivered it (optional). gaps: parts of the row
#   that have no guard yet, each with a half and tracked_by, as in the S1
#   manifest.
#
# Print the open items with: go test -v ./docs -run TestPAS2Manifest
#
# Green ids were verified on 969cfe02 (main after #1369 and #1370), and
# P2S7-I7a re-run on 790bb2cd, with
# TEST_DATABASE_URL empty (sqlite): each mutation was applied, the killing
# tests ran red, the file was restored with git restore and the tests ran
# green.
#
# The P2S2-* records (S2-A1, S2-A2, S2-A4, S2-C10, S2-C12) ran on the P2-S2
# branch, cut from 070c0765, the same way; there the file was restored
# from the bytes read before the mutation. They cover the store only: the
# gaps of each id name what the executor and the cards still owe. The same
# change added lines to internal/db/pa_convo.go, so the P2S7 guards in that
# file were pointed at their new line numbers; their code did not change.
#
# The P2S3-* records (S2-A1, S2-A3, S2-C11, S2-C12, S2-C13, S2-D7, S2-F3) ran
# on the P2-S3 branch the same way, on sqlite, restored from saved bytes.
# They cover the write executor, which has no caller and no FreshSurface
# yet: both are gaps of every id P2-S3 turned green.
#
# The P2S4-* records (S2-A5, S2-A6) ran on the P2-S4 branch, cut from
# 10bd4080, the same way, on sqlite, restored from saved bytes; the tests
# also pass on Postgres. P2-S4 built the FreshSurface (connector.PinFresh)
# but nothing constructs a WriteExecutor outside tests, so the P2-S3 gap
# is reworded on each id, not closed.
#
# The P2S5-* records (S2-X5, S2-A5, S2-A7, S2-A10, S2-D7) ran on the P2-S5
# branch after merging e4c612b8 (main with P2-S4), the same way, on sqlite,
# restored from saved bytes; the tests also pass on Postgres. P2-S5 built
# the approval card and its Approve and Cancel callbacks. In the tests a
# card's Approve reaches DispatchApproved through the webhook's AfterCommit;
# nothing in cmd/server constructs the cards or the executor, so the "no
# caller" gap of the executor ids is reworded, not closed. The change moved
# lines in internal/pa/runloop.go, internal/pa/conversation.go and
# internal/pa/connector/dispatch.go, so the P2S7 guards in those files were
# pointed at their new line numbers; their code did not change.
#
# The P2S6-* records (S2-D2, S2-D3, S2-D4) ran on the P2-S6 branch, cut from
# b55d1955, the same way, on sqlite, restored from saved bytes; the tests
# also pass on Postgres. P2-S6 built the checks a disclosure passes before
# it gets a card and the disclosure card. Nothing constructs the cards or a
# speaker reader outside tests, which is a gap of each id. The change moved
# lines in internal/pa/connector/card.go, so the P2S5-A5c and P2S5-D7c
# guards were pointed at their new line numbers; in P2S5-D7c the guarded
# call is now an assignment (=) in the branch for a card that is not a
# disclosure.
#
# The P2S9-* records (S2-D6) ran on the P2-S9 branch, cut from the P2-S6
# branch at b31b30d7, the same way, on sqlite, restored from saved bytes;
# the tests also pass on Postgres. P2-S9 built the checks and the card of
# alice_trigger_scenario over a ScenarioSteps reader that only tests
# provide. The change moved lines in internal/pa/connector/card.go,
# internal/pa/connector/disclosure.go and
# internal/pa/output/safetext/card.go, so the P2S5 and P2S6 guards in those
# files were pointed at their new line numbers; their code did not change.
#
# The P2S8-* records (S2-D2) ran on the P2-S8 branch, cut from fac5a5aa, the
# same way, on sqlite, restored from saved bytes; the tests also pass on
# Postgres. P2-S8 owns no S2 id: it built the checks and the card of a
# write to one device (alice_media_control, alice_set_volume,
# alice_set_light), which S2-D2 names as "value". Nothing constructs the
# cards or a device reader outside tests, and no reader of lights exists
# at all; both are gaps of S2-D2. The change moved lines in
# internal/pa/connector/card.go, so the P2S5-A5c, P2S5-D7c, P2S6-D2a,
# P2S6-D3c and P2S6-D4b guards were pointed at their new line numbers; in
# P2S5-D7c the guarded call is now in the last branch, for a card that is
# neither a disclosure nor a Phase 2 write. The branch then merged main
# with P2-S9: the P2S8 mutations were run again on the merged code, and
# the guards of both slices were pointed at the merged line numbers.
#
# The P2S10-* records (S2-A8, S2-A9, S2-A10) ran on the P2-S10 branch, cut
# from b55d1955, the same way, on sqlite, restored from saved bytes; the
# tests also pass on Postgres. P2-S10 built the pa_permissions table and
# the /permissions command. Nothing in cmd/server wires the command (it
# needs the Phase 2 pin), nothing reads a permission at dispatch (P2-S11)
# and no device-type rule exists, so outside tests no permission can be
# granted. The change moved lines in internal/pa/conversation.go, so the
# P2S7-I8a guard was pointed at its new line; its code did not change.
#
# The P2S11-* records (S2-I5, S2-I9, S2-D1, S2-D5, S2-A9) ran on the P2-S11
# branch, cut from f49ad63c and merged with f66c8a7b (main with P2-S13),
# the same way, on sqlite, restored from saved bytes; the tests also pass
# on Postgres. All of them were run again after the review fix that made
# the executor ask the pin, and once more after the merge with d42dcc68
# (main with P2-S12). P2-S11 built the lowering of a clean run's
# write under a standing permission (connector/lower.go) and the grant
# rules (permissions/rules.go). Nothing in cmd/server gives the card
# emitter a permission lookup or an executor, so no call is lowered
# outside tests. Lowering has a barrier at each layer, so a record names
# the test of the layer its mutation is in. Three mutations survived
# because another barrier does the same check and were not recorded: the
# emitter looking a permission up for any device write (the gate and the
# rule table hold), and in the executor the digest compare and the
# canonical compare of the bytes (the sealer refuses both). The change
# moved lines in dispatch_write.go, card.go, dispatch.go, device_write.go
# and internal/db/pa_permissions.go: the guards of earlier slices were
# pointed at their new lines; their code did not change.
#
# The P2S12-* records (S2-C9) ran on the P2-S12 branch, cut from f49ad63c,
# the same way, on sqlite, restored from saved bytes; the tests also pass
# on Postgres. P2-S12 made the store cancel approvals and revoke
# permissions when a connection or a principal's authority ends. The
# change moved lines in internal/db/pa_approvals.go, pa_convo.go and
# pa_permissions.go, so the guards of the earlier records in those files
# were pointed at their new line numbers; their code did not change.
# TestS2C10_OldAuthorityRevisionIsRefused now expects ErrCancelled after a
# disconnect or an expiry made by the store (the row is cancelled before
# the consume compares anything); its two raw updates of the connection
# row still prove the comparison, and P2S2-C10a and P2S2-C10b were run
# again on this branch and are red.
#
# The P2S14-* records (no letter before the dash) ran on the P2-S14a
# branches, last after main at 369f3ae1 was merged, the same way, on
# sqlite, restored from saved bytes; the tests also pass on Postgres.
# P2-S14a wired the write path into cmd/server behind PA_WRITES_ENABLED:
# one constructor (buildPAWrites) loads the Phase 2 pin and builds the
# approval sealer, connector.PinFresh, connector.Cards with the
# AliceDevices reader for speakers and lights, the WriteExecutor,
# /permissions with the GrantDevices reader and the action gate
# (pa.ActionGate, P2-S14c), and the webhook's AfterCommit hands an
# approved call to the executor. With the flag not true none of it exists
# (TestNoRuntimePhase2Use allows the Phase 2 constructors in that one
# function, behind its check of the flag, and nowhere else). The same
# slice made "one approval card per run" the server's rule and the worker
# prompt depend on the claim's tools. One record is listed under every id
# whose "no caller in the service" or "not wired" gap it closes, so the
# same P2S14 id recurs across ids. Gaps that stay name what is still
# missing: no reader of scenario steps, no lowered call run end to end in
# cmd/server, and no deployed run of any of it. The change moved lines in
# card.go, runloop.go and parunner.go, so the guards of earlier slices in
# those files were pointed at their new lines; their code did not change.
#
# The P2S14B-* records (S2-D1, S2-D2, S2-D4, S2-D5) ran on the P2-S14b
# branch, cut from cfce1134, on sqlite: each mutation was applied by a
# script, the tree built, the killing tests ran red, the file was restored
# from the bytes read before the mutation and the same tests ran green.
# P2S6-D2b, P2S8-D2g, P2S11-D5a, P2S11-D5d and P2S11-UNa were run again the
# same way, because the code under their guards changed; P2S6-D2e guarded
# the text parser of alice_list_devices, which is gone, and P2S14B-D2e
# stands in its place. Every other guard in the files this change touched
# was pointed at its new line number; its code did not change.
#
# The P2S14c-* records (S2-F3, S2-A8, S2-C9) ran on the P2-S14c branch, cut
# from cfce1134, the same way, on sqlite, restored from saved bytes; the
# tests also pass on Postgres. P2-S14c owns no S2 id: it built the consent
# to actions (pa-actions/v1) and the write scope of a connection, which are
# two more conditions of a write next to the switch, so its records sit
# under S2-F3; the /permissions half is under S2-A8 and the withdrawal
# under S2-C9. The executor has two scope checks, before the fresh listing
# and in the transaction that commits the dispatch; each has a record
# (P2S14c-F3u, P2S14c-F3v) because the test tells them apart by the listing
# count and by a grant narrowed during the listing. The change moved lines
# in internal/pa/permissions.go, permissions/permissions.go, conversation.go,
# internal/pa/connector/card.go, dispatch_write.go, internal/db/pa_convo.go
# and pa_connections.go: the guards of earlier slices were pointed at their
# new lines; their code did not change.

S2-C9:
