S2-D6:
  status: green
  slice: P2-S9
  note: "alice_trigger_scenario (#1322 P2-S9): the card lists the scenario and every step of it, read through a connector.ScenarioSteps reader for that card and sealed with the arguments; a read that failed, or returned no steps, too many or steps that cannot be shown, is refused with no approval row and no call, never a card without steps. The scenario must be named by the id the read returned. A name or id that starts with mctl- is refused with or without a reader. No reader exists outside tests, so a deployed configuration refuses every call (no_write_path) before the tool listing is read."
