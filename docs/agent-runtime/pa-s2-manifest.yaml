    - half: "the server still changes a value that is inside the pin's range: mctl-alice clamps volume, brightness and color temperature into the range the device itself reports, drops a value the device has no capability for, and reports success. The pin's range is refused here, the device's own range is not read. Closing it needs mctl-alice to refuse instead of clamping, or the device's ranges in the read made for the card"
      tracked_by: "#1322"
    - half: "the value and device checks of a device write run on the card path only (Cards.Emit). alice_set_volume and alice_set_light are lowerable and alice_media_control is conditionally lowerable, and nothing acts on gate.OutcomeLowered yet: the code that will send a lowered call without a card must run precheckDeviceWrite and deviceWriteTarget first, or the server's rounding, clamping and name matching come back for calls a standing permission covers"
      tracked_by: "#1322"
    - half: "alice_control_device and alice_control_room have no card path and are refused no_write_path. Owner decision: build the control_device card (it needs the device type from a fresh read and a temperature range), and whether control_room ever gets one"
      tracked_by: "#1322"
    - half: "how mctl-alice carries out an approved alice_set_volume or alice_media_control was read in its source, not run: with a Quasar cookie it sends a voice command to the speaker and falls back to the IoT action when that fails, so one approved call may reach the speaker twice"
      tracked_by: "#1322"

