S2-F3:
  status: green
  slice: P2-S3
  note: "Write executor (#1320 P2-S3): PA_WRITES_ENABLED, with the external-tools and per-server switches, is read at dispatch and again inside the pre-dispatch transaction; off or unreadable refuses writes_off, also for an approval made while it was on. Nothing sets the flag to true. P2-S14c (#1320): with the switch on, an action also needs the principal's consent to actions (pa-actions/v1, a record of its own next to the data-flow consent) and a connection whose token response reported the tool's write scope (alice: iot:control). The switch off or unreadable shows no consent to actions, asks no write scope at /connect and offers no write tool, and every reply is the Phase 1 one; an acceptance given while it was on is kept. pa.ActionGate (the seam for the tool resolver), the card emitter, the executor and /permissions each read the consent and the scope themselves; a refused call tells the principal once per connection. The scope tables are compiled in and checked at startup (connection.CheckScopeConfig)."
