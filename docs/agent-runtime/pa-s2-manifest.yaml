  gaps:
    - half: "the action gate is plugged in and has not run in a deployed service: cmd/server newPAWriteGate builds pa.ActionGate over the store, the writes switch and the scope table of the write path, and a start without a gate is refused (cmd/server.TestPAWrites_ShippedGate), so a claim carries a write tool only with the consent to actions and the tool's scope, and otherwise says which is missing (actions_hint). A claim the gate leaves without a write tool for the consent or the scope queues the gate's notice in its own transaction, once per connection (cmd/server.TestPAWrites_GateNoticeOncePerConnection); the notice leaves with the next outbox pass, and no test measured how long that is in a deployed service. Under the compiled table alice_say_phrase and alice_send_command are held by no connection (they need the quasar scope, which a write connection does not ask for) while cmd/server lists them, so they are never offered; its end-to-end tests run them under a table of their own (paWriteScopes)"
      tracked_by: "#1323"
    - half: "the alice authorization server was read, not called: that it lists iot:control in scopes_supported, puts no scope ceiling on this client and reports the granted scope in the token response is taken from the mctl-alice source; no exchange ran against it"
      tracked_by: "#1320"
    - half: "owner decision: a token response without a scope field, or with an unparseable one, still fails the connection (S1-T9) instead of leaving it view-only; and the two notices are sent once per connection for its whole life, not once per request or per day"
      tracked_by: "#1320"
