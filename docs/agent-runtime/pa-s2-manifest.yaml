  status: green
  slice: P2-S6
  note: "Disclosure target and binding (#1322 P2-S6): alice_say_phrase and alice_send_command get a card only for a device id that a speaker read made for this card lists, byte for byte; a name, a room, an unlisted id and an omitted device are refused (device_not_listed), and a read that failed, was empty or malformed is refused as devices_unreadable, never as not listed. The approval's args_sha is over all of the canonical arguments, the device id included, and the executor refuses stored arguments that do not hash to it (args_changed). Device writes (#1322 P2-S8): alice_media_control, alice_set_volume and alice_set_light get a card only for the id of a speaker, or of a light, that a read made for the card lists, and only for values the pin allows: an integer in its plain spelling inside integer_bounds, or a string the pinned schema lists. A value outside its range, 5.0, 5e0 and a quoted number are refused (value_not_allowed), never rounded or clamped, so the card shows the value in device units and args_sha binds that spelling. A Phase 2 write without a card of its own (alice_control_device, alice_control_room) is refused, never shown as a plain card; alice_trigger_scenario has its own path (S2-D6)."
