        --- FAIL: TestPAWrites_EndToEnd (0.32s)
        --- FAIL: TestBuildPAWrites_RefusesAHalfWiredStart (0.26s)
        FAIL
        FAIL	github.com/mctlhq/mctl-telegram/cmd/server
      green: |-
        ok  	github.com/mctlhq/mctl-telegram/cmd/server	1.423s
  gaps:
    - half: "device writes are wired (P2-S14): cmd/server builds connector.Cards with connector.AliceDevices as the speaker and the light reader and gives the same reader to the WriteExecutor for its read before a send, so alice_media_control, alice_set_volume, alice_set_light and alice_play_music are offered under the action gate and reach the value and device checks, but only alice_say_phrase runs end to end in the cmd/server tests"
      tracked_by: "#1323"
    - half: "the structured device listing is in mctl-alice main (5f6755b7, PR #206) and in no release: against the released 2.18.0, whose alice_list_devices result has no structuredContent, every device read is unreadable and every device write, disclosure and alice_play_music call is refused devices_unreadable. There is no fallback to the text listing, by design. connector.AliceDevices is proven on fixtures copied from mctl-alice's own tests at that commit and was never run against a real server"
      tracked_by: "#1322"
    - half: "mctl-alice main (5f6755b7, unreleased) refuses a value outside the range the device itself reports, or one the device has no capability for, instead of clamping or dropping it; the released 2.18.0 still clamps and reports success. This was read in the source and its tests, not run, and the device's own range is still not read for the card, so such a call gets a card and is then refused by the server"
      tracked_by: "#1322"
    - half: "a lowered call's value checks (precheckDeviceWrite) run in the card emitter only: WriteExecutor.DispatchLowered checks the sealed target, the permission row and, since P2-S14b, the device itself in a fresh read, but takes the spelling and the range of the value from its one caller"
      tracked_by: "#1322"
    - half: "alice_control_device and alice_control_room have no card path and are refused no_write_path. The structured listing now gives the id and type a control_device card would need; the card, its temperature range and the room's device list are not built. Owner decision: accept as a documented limitation, or build them"
      tracked_by: "#1322"
    - half: "how mctl-alice carries out an approved alice_set_volume or alice_media_control was read in its source, not run: with a Quasar cookie it sends a voice command to the speaker and falls back to the IoT action when that fails, so one approved call may reach the speaker twice"
      tracked_by: "#1322"
    - half: "the device is read again and then called in two requests: a change between the re-read and the call is not seen, and the read is of mctl-alice's listing, which the server may serve from a cache of its own"
      tracked_by: "#1322"
    - half: "the re-read at dispatch runs after the approval is consumed, so a refusal there spends the approval and the principal must ask again; a process that dies during the read leaves a dispatch record that the stale sweep resolves as outcome_unknown although nothing was sent (as S2-C12's gap)"
      tracked_by: "#1322"
    - half: "alice_play_music: a speaker that lacks the capability the server sends the command through is not visible in the listing, so it gets a card and the approved call is refused by the server"
      tracked_by: "#1322"

