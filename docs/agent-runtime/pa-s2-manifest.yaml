S2-A9:
  status: green
  slice: P2-S10
  note: "Lowering (#1322 P2-S11): the write executor reads the permission row by id inside its pre-dispatch transaction, after it locked the connection row, and sends a lowered call only if the row is not revoked, not expired, at the connection's revision and still covers the device and the value; otherwise nothing is sent, no ledger row is written and the call gets a card. A lowered call runs the same steps as an approved one (fresh tools/list compare, pre-dispatch audit, one send, result), its ledger row is created, approved and consumed in that transaction, and its audit records carry approver=permission:<id>. Standing permissions (#1320 P2-S10), the store: a lookup returns a permission only for the connection's current authority_revision and before expires_at_ms, and the listing joins the active connection at an equal revision; every revision bump (transition, /disconnect, RevokePAConnectionAt) marks the connection's permissions revoked in the same transaction; a grant longer than 30 days is refused by the insert. A read that fails, or a row that does not decode, is an error and never an empty list. Nothing consults a permission at dispatch yet (P2-S11)."
