      tracked_by: "#1320"
    - half: "lowering is wired and not run end to end in the service: cmd/server buildPAWrites (P2-S14) constructs connector.Cards with Permissions and Lowered, the WriteExecutor and a permissions.Validator with permissions.Rules and the connector.GrantDevices reader, and a grant is made end to end on a write connection in cmd/server.TestPAWrites_EndToEnd, but no lowered call runs in the cmd/server tests (the package tests of this row cover it) and no deployed service has a permission row yet"
      tracked_by: "#1323"

S2-D2:
  status: green
  slice: P2-S6
  note: "Disclosure target and binding (#1322 P2-S6): alice_say_phrase and alice_send_command get a card only for a device id that a speaker read made for this card lists, byte for byte; a name, a room, an unlisted id and an omitted device are refused (device_not_listed), and a read that failed, was empty or malformed is refused as devices_unreadable, never as not listed. The approval's args_sha is over all of the canonical arguments, the device id included, and the executor refuses stored arguments that do not hash to it (args_changed). Device writes (#1322 P2-S8): alice_media_control, alice_set_volume and alice_set_light get a card only for the id of a speaker, or of a light, that a read made for the card lists, and only for values the pin allows: an integer in its plain spelling inside integer_bounds, or a string the pinned schema lists. A value outside its range, 5.0, 5e0 and a quoted number are refused (value_not_allowed), never rounded or clamped, so the card shows the value in device units and args_sha binds that spelling. A Phase 2 write without a card of its own (alice_control_device, alice_control_room) is refused, never shown as a plain card; alice_trigger_scenario has its own path (S2-D6). P2-S14b: the device list is read by connector.AliceDevices from the structured result of alice_list_devices (structuredContent.devices: id, name, type, is_speaker, room, household) and from nothing else. A result without structured content, an error result, the speakers-only listing, a device without an id, a name, a type or the is_speaker flag, an absent room or household member (null is \"not reported\"), one id twice, or more than 512 devices make the whole read unreadable; it is never an empty list and the text of the result is never parsed. A listing read in full that holds no speaker (or no light) is ErrNoSuchDevices, which the card path answers device_not_listed. A speaker tool is never given a light and a light tool never a speaker. alice_play_music gets a card only for the exact id of a listed speaker. The write executor reads the device list again right before it sends an approved or a lowered call to one device (device writes, disclosures, alice_play_music): one read per dispatch, after the pre-dispatch commit, and it sends nothing when the read failed (devices_unreadable), the device is gone (device_not_listed) or its name, room, home, type or kind differs from the sealed target (device_changed); an executor with no device reader for the server refuses no_write_path. Such a refusal has spent the approval."
