S2-D5:
  status: green
  slice: P2-S11
  note: "Standing permission rules (#1322 P2-S11, on the P2-S10 GrantRule hook). permissions.Rules refuses a grant for a tool without a rule (alice_control_device, alice_control_room, alice_trigger_scenario, the disclosures, anything unknown), for an empty device list, for a device whose type is not the tool's by exact dotted prefix (devices.types.media_device for alice_set_volume and alice_media_control, devices.types.light for alice_set_light) or is empty, and for a ceiling that is not valid for the tool; the Validator of P2-S10 refuses an id a fresh device read does not list. Ceiling: alice_set_volume requires one, 1 to 10, and it is the highest \"level\" a call may set; alice_media_control and alice_set_light have none, a grant that names one is refused and a stored one covers nothing. The siren and alarm scenes of alice_set_light are never covered: each gets a card. At dispatch Permission.Covers needs the device id listed in the permission and the level within the ceiling, on both sides of the dispatch (the emitter, then the executor from the bytes it will send); alice_media_control is lowered only for an action in the pin's playback_actions, and the executor asks the pin again, after its fresh tools/list, whether the tool is lowerable and the condition met. The device is read again for every call by the emitter: it must be in a fresh list of the connection's speakers (or lights, for alice_set_light), and a device that left the list, a failed read or an empty list is a refusal with nothing sent, whatever the permission says. P2-S14b: the type is a string the server reports (structuredContent.devices[].type), matched exactly or on a dot boundary: devices.types.smart_speaker.* (and devices.types.media_device) for the speaker tools, devices.types.light for alice_set_light. connector.GrantDevices is the permissions.DeviceReader of a grant, over the principal's own active alice connection. At dispatch the executor refuses a lowered call whose sealed target has a type the tool's rule does not allow (not_lowerable, before anything is read) and reads the device again: a device that is gone, unreadable or whose type, name, room, home or kind changed is refused and nothing is sent."
