schema: mctl-telegram.product-update/v1
id: account-manage-for-delete-disconnect
kind: changed_behavior
title: Disconnecting or deleting your account now needs account management permission
summary: >-
  disconnect_telegram_account and delete_telegram_account, and the matching
  account API calls, now require the account:manage permission. Read-only
  connections, worker tokens and Local Bridge device credentials can no
  longer disconnect or delete the account they were issued for: over MCP the
  two tools are no longer listed, and the API answers 403. Refused attempts
  are recorded in your audit log. On tg.mctl.ai, you can still disconnect
  from the manage page after signing in with Telegram. Changing send consent
  there, and reading or changing notification preferences through
  /api/account/notifications, need account:manage too. After
  signing in with Telegram you can always turn notifications off on the
  manage page; turning one on needs account:manage. On shared-hmac
  deployments every default group now carries account:manage, so read-only
  members can also set their own send consent and notification preferences
  and revoke their own Local Bridge devices; sending still needs the send
  permission.
locale: en
delivery: next_digest
high_value: false
tools: [disconnect_telegram_account, delete_telegram_account]
