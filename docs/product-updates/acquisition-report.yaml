schema: mctl-telegram.product-update/v1
id: acquisition-report
kind: new_tool
title: Admins can see which channels bring new users
summary: >-
  Operators with the admin users scope can call get_acquisition_report to
  see, for a chosen window of up to 90 days, how many people signed up per
  source, how many of them made at least one tool call and how many came
  back on two or more days. The source is recorded once, when an account is
  created: the MCP client they connected with and, if they choose to answer,
  how they heard about the service. No cookie, IP address or user agent is
  used for it, the record is deleted with the account, and the privacy page
  describes it. This tool is for operators; it changes nothing for everyday
  use.
locale: en
delivery: docs_only
