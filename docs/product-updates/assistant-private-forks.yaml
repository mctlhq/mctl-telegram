schema: mctl-telegram.product-update/v1
id: assistant-private-forks
kind: new_tool
title: Make a private version of a catalog assistant
summary: >-
  You can now make your own private version, a fork, of a catalog assistant
  from your MCP client. fork_assistant creates one with your own
  instructions, fewer tools, stricter reply rules or lower limits; a fork can
  only narrow what the original allows, never widen it. update_fork saves a
  new, unchangeable version of it; an install stays on the version it runs
  until you install the new one yourself. delete_fork removes versions you
  no longer use.
  Nobody else can see or install your fork, list_assistants shows it next to
  the catalog, and you install it like any assistant. Every fork version
  runs in observe mode, so replies require your approval before they can be
  sent, and
  you are told in the bot chat whenever a fork is saved. Changing forks needs
  the account management permission.
locale: en
