schema: mctl-telegram.product-update/v1
id: broadcast-channels-with-sponsored
kind: changed_behavior
title: Broadcast channel posts are back, with sponsored messages
summary: >-
  get_messages and get_unread_messages read broadcast channels again, and
  search_messages and get_media no longer refuse them. When a result holds a
  channel's posts, it also carries that channel's official Telegram sponsored
  messages in a separate "sponsored" field, labelled as advertising, as
  Telegram's API terms require; "sponsored_unavailable" names a channel whose
  sponsored messages could not be loaded. Unscoped get_unread_messages reads
  DMs and groups first again and fills the rest of the limit from channels.
locale: en
delivery: next_digest
high_value: false
