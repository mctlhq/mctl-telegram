schema: mctl-telegram.product-update/v1
id: broadcast-source-ref-visible
kind: changed_behavior
title: Broadcast campaigns show their source digest
summary: >-
  get_broadcast and list_broadcasts now include source_ref on a campaign
  prepared from a frozen product-update digest: the digest id, version and
  content hash the text was rendered from. A manually prepared campaign
  (prepare_broadcast) keeps source_ref null, unchanged from before.
