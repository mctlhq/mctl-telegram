schema: mctl-telegram.product-update/v1
id: broadcast-test-audience
kind: changed_behavior
title: Broadcast operators can dry-run a campaign on a test account
summary: >-
  prepare_broadcast takes an optional only_telegram_ids list of at most five
  Telegram ids. It only narrows the audience the server already computed: a
  listed account that is not eligible (no live account, wrong tier, no consent
  for the category, bot cannot reach it) is skipped and never force-sent. The
  list is part of the selector hash, so approval is bound to it. This is for
  operators; it changes nothing for everyday use.
