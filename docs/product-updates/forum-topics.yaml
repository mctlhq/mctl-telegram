schema: mctl-telegram.product-update/v1
id: forum-topics
kind: new_tool
title: Your AI client can read forum topics
summary: >-
  list_topics lists the topics of a forum supergroup with their unread
  counts. get_messages takes a new topic_id argument and then reads only
  that topic, paging with before_id as before; search_messages takes
  topic_id too and searches inside one topic. A chat without topics is
  refused with an error rather than answered with an empty list, and a
  topic id that does not exist is named as such. With the Local Bridge, an
  older daemon refuses a topic read instead of returning the whole forum;
  update the daemon to use topics there. Searching is still not available
  through the Local Bridge.
locale: en
delivery: docs_only
high_value: false
tools: [list_topics, get_messages, search_messages]
