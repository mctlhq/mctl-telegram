schema: mctl-telegram.product-update/v1
id: identity-shows-connected-account
kind: changed_behavior
title: get_my_identity says whether your account is connected
summary: >-
  get_my_identity now reports two things separately: the Telegram account
  this AI client signed in with, and whether that account has a connected
  Telegram session here, with the session's name and the time it was
  connected. When the session cannot be read, the connected field is left
  out instead of being reported as false. The description also explains what
  to do when the manage page in your browser shows a different account than
  your AI client.
