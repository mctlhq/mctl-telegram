schema: mctl-telegram.product-update/v1
id: mark-read
kind: new_tool
title: Your AI client can mark a chat read
summary: >-
  mark_read marks the messages of one chat as read, up to the message id it
  is given; anything newer stays unread. The other side of a private chat
  sees the read receipt, so it works only when real sending is enabled for
  your account, like a send, and it is refused with the reason otherwise.
  It has its own per-chat rate limit, is written to your audit log and
  respects hidden chats. Not available through the Local Bridge yet.
