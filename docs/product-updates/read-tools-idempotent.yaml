schema: mctl-telegram.product-update/v1
id: read-tools-idempotent
kind: changed_behavior
title: Read tools are marked safe to retry
summary: >-
  The tools that only read, such as list_dialogs, get_messages and
  search_messages, now tell your AI client that calling them again with the
  same arguments has no further effect, so a client that supports the MCP
  idempotent hint may retry them after a timeout without asking. Nothing about
  what the tools return or who may call them has changed. Tools that send,
  change or delete anything are not marked, and neither are the media tools
  that work with one-time confirmations.
locale: en
delivery: docs_only
high_value: false
tools: [get_acquisition_report, get_broadcast, get_messages, get_my_audit_log, get_my_identity, get_my_notification_preferences, get_my_send_status, get_unread_messages, get_user_audit_log, list_assistants, list_broadcasts, list_dialogs, list_telegram_identities, search_messages]
