schema: mctl-telegram.product-update/v1
id: reply-into-topic
kind: changed_behavior
title: Replies can go into a forum topic
summary: >-
  draft_reply takes an optional topic_id, so in a forum supergroup a reply
  lands in the topic you name instead of General. The topic is checked to
  exist and be open when the draft is made, its title is shown in the
  draft, and it is part of the single-use confirmation: send_reply delivers
  into that topic and cannot be pointed at another one. send_reply reports
  the topic it delivered to.
locale: en
delivery: docs_only
high_value: false
tools: [draft_reply, send_reply]
