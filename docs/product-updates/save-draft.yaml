schema: mctl-telegram.product-update/v1
id: save-draft
kind: new_tool
title: Your AI client can leave a draft for you to send
summary: >-
  save_draft puts text into a chat's input box as an unsent draft. Nothing
  is sent: the draft shows up in every Telegram app of your account, and
  you send it, edit it or delete it yourself. Because nothing is delivered,
  it works even when real sending is not enabled for your account; the
  server switch, the per-chat rate limit, the audit log and hidden chats
  still apply. A draft you typed yourself is never replaced silently: the
  call is refused and says so, and only an explicit overwrite replaces it.
  Not available through the Local Bridge yet.
locale: en
delivery: docs_only
high_value: true
