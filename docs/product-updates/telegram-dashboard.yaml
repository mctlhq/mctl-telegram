schema: mctl-telegram.product-update/v1
id: telegram-dashboard
kind: new_tool
title: A template dashboard for your Telegram account
summary: >-
  With MCP Apps enabled, the connector can show a tile dashboard built from
  tg-dashboard/v1 templates. Five built-in templates cover unread chats,
  groups, folders, forum topics, and a watchlist search. You can also save
  your own templates on this server (the page itself cannot store them).
  A template may only read chats and messages. The only actions it can
  offer are marking a chat read and saving a draft, and both still go
  through the existing send rules plus a confirmation that names the exact
  chat and text. Sending and deleting are not available from a template.
  list_dialogs now also reports whether a chat is a broadcast channel or a
  supergroup, and whether it is pinned, muted, archived, or a forum, plus
  the latest message id and unread mentions. A folder that was not fully
  scanned is marked incomplete.
