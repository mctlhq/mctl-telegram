schema: mctl-telegram.product-update/v1
id: tool-list-follows-scopes
kind: changed_behavior
title: Your tool list now matches what your connection may do
summary: >-
  The tool list a client sees now depends on the permissions its connection
  was granted. A connection granted only read access no longer lists the
  sending, pinning, account-settings, operator or broadcast tools, and a
  direct call to one of them is refused instead of returning a preview.
  Connections with full access see the same tools as before. set_reaction and
  set_my_notification_preferences are now marked as changing existing state,
  set_send_consent has a clearer title, and the descriptions of
  delete_telegram_account and prepare_pin_message were corrected.
locale: en
delivery: next_digest
high_value: false
tools: [set_reaction, set_my_notification_preferences, set_send_consent, delete_telegram_account, prepare_pin_message]
evidence:
  from: 0.81.0
  changes:
    - {tool: set_reaction, change: annotations}
    - {tool: set_my_notification_preferences, change: annotations}
    - {tool: set_send_consent, change: annotations}
    - {tool: delete_telegram_account, change: text}
    - {tool: prepare_pin_message, change: text}
