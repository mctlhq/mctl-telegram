schema: mctl-telegram.product-update/v1
id: unread-in-folder
kind: changed_behavior
title: Unread messages from one chat folder
summary: >-
  get_unread_messages takes an optional folder id from list_folders and
  then reads only the chats in that folder, in the same order as an
  unscoped call. The folder is checked over the same window list_dialogs
  uses (the 200 most recent chats and 100 archived ones), and folder_scan
  says whether that covered every chat. It cannot be combined with peer.
  Connections under a core tool profile (core-readonly, core-reply) do
  not get folder: those profiles read one named chat at a time.
locale: en
delivery: docs_only
high_value: false
tools: [get_unread_messages]
